name: Build Android APK on release or manual run

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build-apk:
    name: Build APK and upload to Release
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (required for Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Ensure Flutter project scaffold (create android/ if missing)
        run: |
          if [ ! -d "flutter_app/android" ]; then
            echo "android/ missing — creating Flutter scaffold"
            (cd flutter_app && flutter create .)
          else
            echo "android/ exists — skipping flutter create"
          fi

      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/**/pubspec.yaml') }}-${{ hashFiles('flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses || true
        working-directory: flutter_app

      - name: Restore Android keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
