services:
  raymond:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raymond-v2-8-trader
    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: sqlite:///./raymond.db
      LIVE_TRADING_ENABLED: "false"
      RAYMOND_ENV: development
      LOG_LEVEL: INFO

      MT5_LOGIN: demo_login
      MT5_PASSWORD: demo_password
      MT5_SERVER: MT5-Demo
      MT5_ACCOUNT_TYPE: demo

    command:
      - sh
      - -c
      - uvicorn online_main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
