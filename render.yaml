services:
  - type: web
    name: raymond-v2-8-trader
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: LIVE_TRADING_ENABLED
        value: "false"

      - key: RAYMOND_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: raymond-v2-8-db
          property: connectionString

      - key: LOG_LEVEL
        value: INFO

databases:
  - name: raymond-v2-8-db
    plan: free
    region: singapore
    databaseName: raymond_v2_8_db
    user: raymond_v2_8_db_user
