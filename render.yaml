services:
  - type: web
    name: raymond-v2-8-trader
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      # ------------------------------------------------------------------
      # Raymond environment
      # ------------------------------------------------------------------

      - key: RAYMOND_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      # ------------------------------------------------------------------
      # Database
      # ------------------------------------------------------------------

      - key: DATABASE_URL
        fromDatabase:
          name: raymond-v2-8-db
          property: connectionString

      # ------------------------------------------------------------------
      # LIVE TRADING SAFETY
      # ------------------------------------------------------------------

      # MUST remain disabled until DEMO E2E validation is completed.
      - key: LIVE_TRADING_ENABLED
        value: "false"

      # ------------------------------------------------------------------
      # Remote MT5 Execution Bridge
      # ------------------------------------------------------------------

      # These remain unset until a Windows/VPS MT5 host exists.
      # They are supplied separately through Render environment secrets.
      - key: MT5_BRIDGE_URL
        sync: false

      - key: MT5_BRIDGE_API_KEY
        sync: false

      - key: MT5_BRIDGE_TIMEOUT_SECONDS
        value: "10"

databases:
  - name: raymond-v2-8-db
    plan: free
    region: singapore
    databaseName: raymond_v2_8_db
    user: raymond_v2_8_db_user
