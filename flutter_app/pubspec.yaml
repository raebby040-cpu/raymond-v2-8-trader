name: raymond_v2_8_trader
description: RAYMOND v2.8 - XAUUSD Trading Dashboard with Paper Trading, Risk Management, and Backtesting.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  dio: ^5.3.0
  syncfusion_flutter_charts: ^24.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  loading_animation_widget: ^1.2.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
