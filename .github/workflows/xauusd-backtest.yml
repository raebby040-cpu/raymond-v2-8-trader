name: XAUUSD H1 Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RAYMOND
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install RAYMOND dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify RAYMOND backtest files
        run: |
          test -f scripts/run_xauusd_backtest.py
          test -f backend/app/backtest_engine.py
          echo "Backtest runner: OK"
          echo "Backtest engine: OK"

      - name: Download XAUUSD H1 historical data
        run: |
          rm -rf data/historical
          mkdir -p data/historical

          npx --yes dukascopy-node \
            -i xauusd \
            -from 2003-05-05 \
            -to 2026-01-01 \
            -t h1 \
            -f csv \
            -dir data/historical

      - name: Locate historical CSV
        run: |
          echo "===== DOWNLOADED FILES ====="
          find data/historical -type f -printf '%p %s bytes\n'

          FILE="$(find data/historical \
            -type f \
            -iname '*xauusd*h1*.csv' \
            | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "ERROR: XAUUSD H1 CSV was not found."
            exit 1
          fi

          echo "Historical file found:"
          echo "$FILE"

          echo "XAUUSD_RAW_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Verify raw historical dataset
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          path = os.environ["XAUUSD_RAW_FILE"]

          df = pd.read_csv(path)

          print("===== RAW DATASET =====")
          print("Rows:", len(df))
          print("Columns:", list(df.columns))
          print()
          print(df.head())
          print()
          print(df.tail())

          required = {
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  "ERROR: Missing required columns: "
                  f"{sorted(missing)}"
              )

          if len(df) < 10000:
              raise SystemExit(
                  f"ERROR: Dataset too small: {len(df)} rows"
              )

          print()
          print("Raw historical dataset verification PASSED.")
          PY

      - name: Normalize historical dataset
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          source = Path(os.environ["XAUUSD_RAW_FILE"])

          target = Path(
              "data/historical/"
              "xauusd_h1_2003_2025_normalized.csv"
          )

          df = pd.read_csv(source)

          required = {
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing columns: {sorted(missing)}"
              )

          # Dukascopy's XAUUSD export used here does not
          # provide volume. RAYMOND's candle interface
          # requires the field, so use zero rather than
          # inventing volume data.
          if "volume" not in df.columns:
              print(
                  "Volume column not supplied by source. "
                  "Setting volume to 0.0."
              )
              df["volume"] = 0.0

          df["timestamp"] = pd.to_datetime(
              df["timestamp"],
              utc=True,
              errors="coerce",
          )

          for column in [
              "open",
              "high",
              "low",
              "close",
              "volume",
          ]:
              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )

          df = df.dropna(
              subset=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
              ]
          )

          # Exact historical test period.
          df = df[
              (df["timestamp"] >= pd.Timestamp(
                  "2003-05-05",
                  tz="UTC",
              ))
              &
              (df["timestamp"] < pd.Timestamp(
                  "2026-01-01",
                  tz="UTC",
              ))
          ]

          df = df.sort_values("timestamp")

          duplicate_count = int(
              df["timestamp"].duplicated().sum()
          )

          df = df.drop_duplicates(
              subset=["timestamp"],
              keep="first",
          )

          invalid = (
              (df["open"] <= 0)
              | (df["high"] <= 0)
              | (df["low"] <= 0)
              | (df["close"] <= 0)
              | (df["high"] < df["low"])
              | (df["high"] < df["open"])
              | (df["high"] < df["close"])
              | (df["low"] > df["open"])
              | (df["low"] > df["close"])
          )

          invalid_count = int(invalid.sum())

          if invalid_count:
              raise SystemExit(
                  f"ERROR: Invalid OHLC rows: {invalid_count}"
              )

          if len(df) < 10000:
              raise SystemExit(
                  f"ERROR: Normalized dataset too small: {len(df)}"
              )

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          df[
              [
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume",
              ]
          ].to_csv(
              target,
              index=False,
          )

          print()
          print("===== NORMALIZED DATASET =====")
          print("Rows:", len(df))
          print(
              "First candle:",
              df["timestamp"].iloc[0],
          )
          print(
              "Last candle:",
              df["timestamp"].iloc[-1],
          )
          print(
              "Duplicate timestamps before cleanup:",
              duplicate_count,
          )
          print(
              "Duplicate timestamps after cleanup:",
              int(df["timestamp"].duplicated().sum()),
          )
          print(
              "Invalid OHLC rows:",
              invalid_count,
          )
          print(
              "Volume values:",
              df["volume"].unique()[:10],
          )

          print()
          print("Normalization PASSED.")
          PY

      - name: Run RAYMOND H1 backtest
        env:
          PYTHONPATH: backend
        run: |
          rm -rf backtest_results

          python scripts/run_xauusd_backtest.py \
            --data data/historical/xauusd_h1_2003_2025_normalized.csv \
            --out backtest_results \
            --starting-balance 10000 \
            --spread 0.30 \
            --slippage 0.05 \
            --commission 0.0

      - name: Verify backtest results
        run: |
          if [ ! -f backtest_results/result.json ]; then
            echo "ERROR: result.json was not created."
            exit 1
          fi

          if [ ! -f backtest_results/trades.csv ]; then
            echo "ERROR: trades.csv was not created."
            exit 1
          fi

          echo "===== RAYMOND RESULT ====="
          cat backtest_results/result.json

      - name: Print key metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "backtest_results/result.json"
              ).read_text()
          )

          print()
          print("========================================")
          print(" RAYMOND v2.8 XAUUSD H1 BACKTEST")
          print("========================================")

          metrics = [
              "status",
              "start_time",
              "end_time",
              "starting_balance",
              "ending_balance",
              "net_profit",
              "net_profit_percent",
              "total_trades",
              "winning_trades",
              "losing_trades",
              "breakeven_trades",
              "win_rate_percent",
              "gross_profit",
              "gross_loss",
              "profit_factor",
              "total_execution_cost",
              "max_drawdown",
              "max_drawdown_percent",
              "average_trade",
              "average_win",
              "average_loss",
              "bars_processed",
              "warmup_candles",
          ]

          for key in metrics:
              print(
                  f"{key}: {result.get(key)}"
              )

          print("========================================")
          PY

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: raymond-xauusd-h1-backtest-results
          path: |
            backtest_results/
            data/historical/xauusd_h1_2003_2025_normalized.csv
          retention-days: 7
