name: XAUUSD H1 Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RAYMOND
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install RAYMOND dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify RAYMOND backtest files
        run: |
          test -f scripts/run_xauusd_backtest.py
          test -f backend/app/backtest_engine.py

          echo "Backtest runner: OK"
          echo "Backtest engine: OK"

      - name: Download XAUUSD H1 historical data
        run: |
          rm -rf data/historical
          mkdir -p data/historical

          npx --yes dukascopy-node \
            -i xauusd \
            -from 2003-05-05 \
            -to 2026-01-01 \
            -t h1 \
            -f csv \
            -dir data/historical

      - name: Locate historical CSV
        run: |
          echo "===== DOWNLOADED FILES ====="

          find data/historical \
            -type f \
            -printf '%p %s bytes\n'

          FILE="$(find data/historical \
            -type f \
            -iname '*xauusd*h1*.csv' \
            | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "ERROR: XAUUSD H1 CSV was not found."
            exit 1
          fi

          echo "Historical file found:"
          echo "$FILE"

          echo "XAUUSD_RAW_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Verify raw historical dataset
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          path = os.environ["XAUUSD_RAW_FILE"]

          df = pd.read_csv(path)

          print("===== RAW DATASET =====")
          print("Rows:", len(df))
          print("Columns:", list(df.columns))
          print()
          print(df.head())
          print()
          print(df.tail())

          required = {
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  "ERROR: Missing required columns: "
                  f"{sorted(missing)}"
              )

          if len(df) < 10000:
              raise SystemExit(
                  f"ERROR: Dataset too small: {len(df)} rows"
              )

          print()
          print("Raw historical dataset verification PASSED.")
          PY

      - name: Normalize historical dataset
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          source = Path(os.environ["XAUUSD_RAW_FILE"])

          target = Path(
              "data/historical/"
              "xauusd_h1_2003_2025_normalized.csv"
          )

          df = pd.read_csv(source)

          required = {
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing columns: {sorted(missing)}"
              )

          # Dukascopy XAUUSD export may not contain volume.
          # RAYMOND requires the field, but does not use
          # volume as an execution input in this backtest.
          if "volume" not in df.columns:
              print(
                  "Volume column not supplied by source."
              )
              print(
                  "Setting volume to 0.0."
              )
              df["volume"] = 0.0

          # -------------------------------------------------
          # TIMESTAMP FIX
          #
          # Dukascopy can return timestamps such as:
          #
          # 1767200400000
          #
          # These are Unix timestamps in MILLISECONDS.
          #
          # Detect numeric millisecond timestamps and parse
          # them explicitly as milliseconds.
          # -------------------------------------------------

          raw_timestamp = df["timestamp"]

          numeric_timestamp = pd.to_numeric(
              raw_timestamp,
              errors="coerce",
          )

          numeric_ratio = (
              numeric_timestamp.notna().mean()
          )

          if numeric_ratio > 0.95:
              print(
                  "Detected numeric timestamp format."
              )
              print(
                  "Parsing timestamps as Unix milliseconds."
              )

              df["timestamp"] = pd.to_datetime(
                  numeric_timestamp,
                  unit="ms",
                  utc=True,
                  errors="coerce",
              )
          else:
              print(
                  "Detected non-numeric timestamp format."
              )
              print(
                  "Parsing timestamps as ISO/datetime values."
              )

              df["timestamp"] = pd.to_datetime(
                  raw_timestamp,
                  utc=True,
                  errors="coerce",
              )

          # -------------------------------------------------
          # Numeric OHLC fields
          # -------------------------------------------------

          for column in [
              "open",
              "high",
              "low",
              "close",
              "volume",
          ]:
              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )

          # Remove rows with unusable timestamp/OHLC data.
          df = df.dropna(
              subset=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
              ]
          )

          # -------------------------------------------------
          # Historical test period
          # -------------------------------------------------

          start_date = pd.Timestamp(
              "2003-05-05",
              tz="UTC",
          )

          end_date = pd.Timestamp(
              "2026-01-01",
              tz="UTC",
          )

          print()
          print("Before date filtering:", len(df))
          print(
              "Detected first timestamp:",
              df["timestamp"].min(),
          )
          print(
              "Detected last timestamp:",
              df["timestamp"].max(),
          )

          df = df[
              (df["timestamp"] >= start_date)
              &
              (df["timestamp"] < end_date)
          ]

          print(
              "After date filtering:",
              len(df),
          )

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Date filtering produced 0 candles. "
                  "Timestamp parsing is still incorrect."
              )

          # -------------------------------------------------
          # Sort and remove duplicate candles
          # -------------------------------------------------

          df = df.sort_values("timestamp")

          duplicate_count = int(
              df["timestamp"].duplicated().sum()
          )

          df = df.drop_duplicates(
              subset=["timestamp"],
              keep="first",
          )

          # -------------------------------------------------
          # OHLC validation
          # -------------------------------------------------

          invalid = (
              (df["open"] <= 0)
              | (df["high"] <= 0)
              | (df["low"] <= 0)
              | (df["close"] <= 0)
              | (df["high"] < df["low"])
              | (df["high"] < df["open"])
              | (df["high"] < df["close"])
              | (df["low"] > df["open"])
              | (df["low"] > df["close"])
          )

          invalid_count = int(
              invalid.sum()
          )

          if invalid_count:
              raise SystemExit(
                  f"ERROR: Invalid OHLC rows: "
                  f"{invalid_count}"
              )

          if len(df) < 10000:
              raise SystemExit(
                  "ERROR: Normalized dataset is too small: "
                  f"{len(df)}"
              )

          # -------------------------------------------------
          # Save normalized dataset
          # -------------------------------------------------

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          df[
              [
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume",
              ]
          ].to_csv(
              target,
              index=False,
          )

          print()
          print("========================================")
          print(" NORMALIZED XAUUSD H1 DATASET")
          print("========================================")
          print("Rows:", len(df))
          print(
              "First candle:",
              df["timestamp"].iloc[0],
          )
          print(
              "Last candle:",
              df["timestamp"].iloc[-1],
          )
          print(
              "Duplicates before cleanup:",
              duplicate_count,
          )
          print(
              "Duplicates after cleanup:",
              int(
                  df["timestamp"]
                  .duplicated()
                  .sum()
              ),
          )
          print(
              "Invalid OHLC rows:",
              invalid_count,
          )
          print(
              "Volume sample:",
              df["volume"].unique()[:10],
          )
          print("========================================")
          print()
          print("Normalization PASSED.")
          PY

      - name: Run RAYMOND H1 backtest
        env:
          PYTHONPATH: backend
        run: |
          rm -rf backtest_results

          python scripts/run_xauusd_backtest.py \
            --data data/historical/xauusd_h1_2003_2025_normalized.csv \
            --out backtest_results \
            --starting-balance 10000 \
            --spread 0.30 \
            --slippage 0.05 \
            --commission 0.0

      - name: Verify backtest results
        run: |
          if [ ! -f backtest_results/result.json ]; then
            echo "ERROR: result.json was not created."
            exit 1
          fi

          if [ ! -f backtest_results/trades.csv ]; then
            echo "ERROR: trades.csv was not created."
            exit 1
          fi

          echo "===== RAYMOND RESULT ====="

          cat backtest_results/result.json

      - name: Print key metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "backtest_results/result.json"
              ).read_text()
          )

          print()
          print("========================================")
          print(" RAYMOND v2.8 XAUUSD H1 BACKTEST")
          print("========================================")

          metrics = [
              "status",
              "start_time",
              "end_time",
              "starting_balance",
              "ending_balance",
              "net_profit",
              "net_profit_percent",
              "total_trades",
              "winning_trades",
              "losing_trades",
              "breakeven_trades",
              "win_rate_percent",
              "gross_profit",
              "gross_loss",
              "profit_factor",
              "total_execution_cost",
              "max_drawdown",
              "max_drawdown_percent",
              "average_trade",
              "average_win",
              "average_loss",
              "bars_processed",
              "warmup_candles",
          ]

          for key in metrics:
              print(
                  f"{key}: {result.get(key)}"
              )

          print("========================================")
          PY

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: raymond-xauusd-h1-backtest-results
          path: |
            backtest_results/
            data/historical/xauusd_h1_2003_2025_normalized.csv
          retention-days: 7
