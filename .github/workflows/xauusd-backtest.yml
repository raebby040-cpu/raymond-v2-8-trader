name: XAUUSD H1 Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    # Hard upper bound for the complete job.
    # The individual download and backtest steps also have
    # their own timeouts so the workflow cannot silently hang.
    timeout-minutes: 60

    steps:
      - name: Checkout RAYMOND
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install RAYMOND dependencies
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

          python --version
          node --version
          npm --version

      - name: Verify RAYMOND backtest files
        run: |
          set -euxo pipefail

          test -f scripts/run_xauusd_backtest.py
          test -f backend/app/backtest_engine.py
          test -f backend/app/ai_trading_decision.py
          test -f backend/app/trading_pipeline_service.py
          test -f backend/app/risk_engine.py

          echo "========================================"
          echo "RAYMOND BACKTEST FILE CHECK"
          echo "========================================"
          echo "Backtest runner: OK"
          echo "Backtest engine: OK"
          echo "AI decision engine: OK"
          echo "Trading pipeline: OK"
          echo "Risk engine: OK"
          echo "========================================"

      # ------------------------------------------------------------
      # IMPORTANT:
      #
      # The previous workflow attempted to download approximately
      # 2003 -> 2026 in one operation.
      #
      # For the first reliable validation run we deliberately use
      # a bounded 2024 -> 2025 period.
      #
      # Once the complete pipeline is proven, we can expand the
      # historical period after optimizing the backtest engine.
      # ------------------------------------------------------------

      - name: Set backtest period
        run: |
          set -euxo pipefail

          echo "XAUUSD_START=2024-01-01" >> "$GITHUB_ENV"
          echo "XAUUSD_END=2026-01-01" >> "$GITHUB_ENV"

          echo "Backtest period:"
          echo "2024-01-01 -> 2026-01-01"

      - name: Download XAUUSD H1 historical data
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf data/historical
          mkdir -p data/historical

          echo "========================================"
          echo "DOWNLOADING XAUUSD H1 DATA"
          echo "========================================"
          echo "From: $XAUUSD_START"
          echo "To:   $XAUUSD_END"
          echo "========================================"

          # Never allow the external downloader to run forever.
          timeout --foreground 15m \
            npx --yes dukascopy-node \
              -i xauusd \
              -from "$XAUUSD_START" \
              -to "$XAUUSD_END" \
              -t h1 \
              -f csv \
              -dir data/historical

          echo "Dukascopy download command completed."

      - name: Locate historical CSV
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "DOWNLOADED FILES"
          echo "========================================"

          find data/historical \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo "========================================"

          FILE="$(
            find data/historical \
              -type f \
              \( \
                -iname '*xauusd*h1*.csv' \
                -o \
                -iname '*xauusd*.csv' \
              \) \
              -size +1k \
              | head -n 1
          )"

          if [ -z "$FILE" ]; then
            echo "ERROR: No usable XAUUSD CSV was found."
            echo
            echo "All files currently present:"
            find data/historical -type f -print || true
            exit 1
          fi

          echo "Historical file found:"
          echo "$FILE"

          echo "XAUUSD_RAW_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Verify raw historical dataset
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          path = Path(os.environ["XAUUSD_RAW_FILE"])

          print("========================================")
          print("RAW DATASET VALIDATION")
          print("========================================")
          print("File:", path)
          print("Size:", path.stat().st_size, "bytes")

          if path.stat().st_size <= 1024:
              raise SystemExit(
                  "ERROR: Historical CSV is empty or too small."
              )

          df = pd.read_csv(path)

          print("Rows:", len(df))
          print("Columns:", list(df.columns))

          if df.empty:
              raise SystemExit(
                  "ERROR: Historical dataset contains zero rows."
              )

          required = {
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  "ERROR: Missing required columns: "
                  f"{sorted(missing)}"
              )

          for column in [
              "open",
              "high",
              "low",
              "close",
          ]:
              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )

          invalid = df[
              [
                  "open",
                  "high",
                  "low",
                  "close",
              ]
          ].isna().any(axis=1)

          if invalid.any():
              raise SystemExit(
                  "ERROR: Dataset contains "
                  f"{int(invalid.sum())} rows with invalid OHLC values."
              )

          if len(df) < 5000:
              raise SystemExit(
                  "ERROR: Dataset unexpectedly small: "
                  f"{len(df)} rows."
              )

          print()
          print("First raw row:")
          print(df.head(1).to_string(index=False))

          print()
          print("Last raw row:")
          print(df.tail(1).to_string(index=False))

          print()
          print("Raw dataset validation PASSED.")
          print("========================================")
          PY

      - name: Normalize historical dataset
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          source = Path(os.environ["XAUUSD_RAW_FILE"])

          target = Path(
              "data/historical/"
              "xauusd_h1_2024_2025_normalized.csv"
          )

          df = pd.read_csv(source)

          required = {
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing columns: {sorted(missing)}"
              )

          # Dukascopy exports do not always expose a usable volume
          # column. Raymond's current H1 backtest requires the field
          # structurally, but does not use zero volume as real market
          # buy/sell volume.
          if "volume" not in df.columns:
              df["volume"] = 0.0

          # ---------------------------------------------------------
          # Timestamp normalization
          # ---------------------------------------------------------

          raw_timestamp = df["timestamp"]

          numeric_timestamp = pd.to_numeric(
              raw_timestamp,
              errors="coerce",
          )

          numeric_ratio = (
              numeric_timestamp.notna().mean()
          )

          if numeric_ratio > 0.95:
              print(
                  "Detected numeric timestamps."
              )

              df["timestamp"] = pd.to_datetime(
                  numeric_timestamp,
                  unit="ms",
                  utc=True,
                  errors="coerce",
              )
          else:
              print(
                  "Detected textual timestamps."
              )

              df["timestamp"] = pd.to_datetime(
                  raw_timestamp,
                  utc=True,
                  errors="coerce",
              )

          # ---------------------------------------------------------
          # Numeric OHLC/volume
          # ---------------------------------------------------------

          for column in [
              "open",
              "high",
              "low",
              "close",
              "volume",
          ]:
              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )

          before_cleanup = len(df)

          df = df.dropna(
              subset=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
              ]
          )

          dropped_invalid = (
              before_cleanup - len(df)
          )

          # ---------------------------------------------------------
          # Date filtering
          # ---------------------------------------------------------

          start_date = pd.Timestamp(
              os.environ["XAUUSD_START"],
              tz="UTC",
          )

          end_date = pd.Timestamp(
              os.environ["XAUUSD_END"],
              tz="UTC",
          )

          print()
          print("Detected first timestamp:")
          print(df["timestamp"].min())

          print("Detected last timestamp:")
          print(df["timestamp"].max())

          df = df[
              (df["timestamp"] >= start_date)
              &
              (df["timestamp"] < end_date)
          ].copy()

          if df.empty:
              raise SystemExit(
                  "ERROR: Date filtering produced zero candles."
              )

          # ---------------------------------------------------------
          # Sort + duplicate removal
          # ---------------------------------------------------------

          df = df.sort_values(
              "timestamp"
          ).reset_index(drop=True)

          duplicate_count = int(
              df["timestamp"].duplicated().sum()
          )

          if duplicate_count:
              df = df.drop_duplicates(
                  subset=["timestamp"],
                  keep="first",
              ).reset_index(drop=True)

          # ---------------------------------------------------------
          # OHLC validation
          # ---------------------------------------------------------

          invalid = (
              (df["open"] <= 0)
              | (df["high"] <= 0)
              | (df["low"] <= 0)
              | (df["close"] <= 0)
              | (df["high"] < df["low"])
              | (df["high"] < df["open"])
              | (df["high"] < df["close"])
              | (df["low"] > df["open"])
              | (df["low"] > df["close"])
          )

          invalid_count = int(
              invalid.sum()
          )

          if invalid_count:
              raise SystemExit(
                  "ERROR: Invalid OHLC rows: "
                  f"{invalid_count}"
              )

          if len(df) < 5000:
              raise SystemExit(
                  "ERROR: Normalized dataset is unexpectedly small: "
                  f"{len(df)}"
              )

          # ---------------------------------------------------------
          # Save normalized dataset
          # ---------------------------------------------------------

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          df[
              [
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume",
              ]
          ].to_csv(
              target,
              index=False,
          )

          print()
          print("========================================")
          print("NORMALIZED XAUUSD H1 DATASET")
          print("========================================")
          print("Rows:", len(df))
          print(
              "First candle:",
              df["timestamp"].iloc[0],
          )
          print(
              "Last candle:",
              df["timestamp"].iloc[-1],
          )
          print(
              "Invalid rows removed:",
              dropped_invalid,
          )
          print(
              "Duplicate rows removed:",
              duplicate_count,
          )
          print(
              "Final duplicate count:",
              int(
                  df["timestamp"].duplicated().sum()
              ),
          )
          print("========================================")

          print()
          print("Normalization PASSED.")
          PY

      - name: Inspect normalized dataset
        run: |
          set -euxo pipefail

          python - <<'PY'
          import pandas as pd

          path = (
              "data/historical/"
              "xauusd_h1_2024_2025_normalized.csv"
          )

          df = pd.read_csv(path)

          print("Rows:", len(df))
          print("Columns:", list(df.columns))
          print()
          print(df.head(3).to_string(index=False))
          print()
          print(df.tail(3).to_string(index=False))
          PY

      # ------------------------------------------------------------
      # IMPORTANT:
      #
      # The runner itself now has an internal progress heartbeat.
      # The shell timeout below is an additional safety layer.
      # ------------------------------------------------------------

      - name: Run RAYMOND H1 backtest
        shell: bash
        env:
          PYTHONPATH: backend
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail

          rm -rf backtest_results
          mkdir -p backtest_results

          echo "========================================"
          echo "STARTING RAYMOND BACKTEST"
          echo "========================================"
          date -u

          timeout --foreground 30m \
            python scripts/run_xauusd_backtest.py \
              --data data/historical/xauusd_h1_2024_2025_normalized.csv \
              --out backtest_results \
              --starting-balance 10000 \
              --spread 0.30 \
              --slippage 0.05 \
              --commission 0.0 \
              --progress-every 1000

          STATUS=$?

          echo
          echo "Backtest process exit code: $STATUS"

          if [ "$STATUS" -eq 124 ]; then
            echo "ERROR: RAYMOND backtest exceeded 30 minutes."
            echo "This indicates the strategy/backtest engine needs"
            echo "optimization before attempting the full historical period."
            exit 124
          fi

          exit "$STATUS"

      - name: Verify backtest results
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "BACKTEST OUTPUT INSPECTION"
          echo "========================================"

          if [ -f backtest_results/result.json ]; then
            echo "result.json: FOUND"
            cat backtest_results/result.json
          else
            echo "result.json: NOT FOUND"
          fi

          if [ -f backtest_results/trades.csv ]; then
            echo "trades.csv: FOUND"
            echo "Trade rows:"
            wc -l backtest_results/trades.csv
          else
            echo "trades.csv: NOT FOUND"
          fi

          echo
          echo "Backtest directory:"
          find backtest_results \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

      - name: Print key metrics
        if: always()
        shell: bash
        run: |
          set +e

          if [ ! -f backtest_results/result.json ]; then
            echo "No result.json available."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "backtest_results/result.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          print()
          print("========================================")
          print("RAYMOND v2.8 XAUUSD H1 BACKTEST")
          print("========================================")

          metrics = [
              "status",
              "start_time",
              "end_time",
              "starting_balance",
              "ending_balance",
              "net_profit",
              "net_profit_percent",
              "total_trades",
              "winning_trades",
              "losing_trades",
              "breakeven_trades",
              "win_rate_percent",
              "gross_profit",
              "gross_loss",
              "profit_factor",
              "total_execution_cost",
              "max_drawdown",
              "max_drawdown_percent",
              "average_trade",
              "average_win",
              "average_loss",
              "bars_processed",
              "warmup_candles",
          ]

          for key in metrics:
              print(
                  f"{key}: {result.get(key)}"
              )

          print("========================================")
          PY

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raymond-xauusd-h1-backtest-results
          path: |
            backtest_results/
            data/historical/
          if-no-files-found: warn
          retention-days: 14
