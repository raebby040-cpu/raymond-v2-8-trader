name: Safely Connect User Paper Positions V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-user-paper-positions
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Connect existing positions module safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path("backend/app/main.py")
          module_path = Path("backend/app/user_positions_api.py")

          if not main_path.is_file():
              raise SystemExit("STOP: main.py not found.")

          if not module_path.is_file():
              raise SystemExit(
                  "STOP: user_positions_api.py not found. "
                  "No files changed."
              )

          source = main_path.read_text(encoding="utf-8")

          old_import = (
              "try:\n"
              "    from .user_auth import router as user_auth_router\n"
              "except ImportError:\n"
              "    from user_auth import router as user_auth_router\n"
          )

          new_import = (
              "try:\n"
              "    from .user_auth import router as user_auth_router\n"
              "    from .user_positions_api import "
              "router as user_positions_router\n"
              "except ImportError:\n"
              "    from user_auth import router as user_auth_router\n"
              "    from user_positions_api import "
              "router as user_positions_router\n"
          )

          relative_import = (
              "from .user_positions_api import "
              "router as user_positions_router"
          )
          fallback_import = (
              "from user_positions_api import "
              "router as user_positions_router"
          )

          has_relative = relative_import in source
          has_fallback = fallback_import in source

          if not has_relative and not has_fallback:
              if source.count(old_import) != 1:
                  raise SystemExit(
                      "STOP: Could not safely locate the authentication "
                      "imports exactly once. No files changed."
                  )
              source = source.replace(old_import, new_import, 1)
          elif not has_relative or not has_fallback:
              raise SystemExit(
                  "STOP: Only one positions import was found. "
                  "Manual review is required; no files changed."
              )

          registration_pattern = (
              r"app\.include_router\(\s*"
              r"user_positions_router\s*,"
          )

          if not re.search(registration_pattern, source):
              old_registration = (
                  "app.include_router(\n"
                  "    user_auth_router,\n"
                  '    tags=["User Authentication"],\n'
                  ")\n"
              )

              if source.count(old_registration) != 1:
                  raise SystemExit(
                      "STOP: Could not safely locate the authentication "
                      "router registration exactly once. No files changed."
                  )

              new_registration = old_registration + (
                  "\n"
                  "app.include_router(\n"
                  "    user_positions_router,\n"
                  '    tags=["User Paper Positions"],\n'
                  ")\n"
              )

              source = source.replace(
                  old_registration, new_registration, 1
              )

          if not re.search(registration_pattern, source):
              raise SystemExit(
                  "STOP: Positions router registration was not verified."
              )

          main_path.write_text(source, encoding="utf-8")
          print("Verified positions router import and registration.")

          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            backend/app/main.py \
            backend/app/user_positions_api.py

      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          if git diff --cached --quiet; then
            echo "No new changes were necessary."
          else
            git commit -m "Connect authenticated user paper positions API"
            git push origin HEAD:main
          fi
