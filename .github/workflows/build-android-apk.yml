name: Build Raymond V2.8 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          flutter --version
          test -f pubspec.yaml
          echo "Flutter project found."

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            echo "Android directory missing. Creating it..."
            flutter create --platforms=android .
          else
            echo "Android directory already exists."
          fi

      - name: Ensure Android Internet permission
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' \
          android/app/src/main/AndroidManifest.xml

          echo "Checking Internet permission..."
          grep 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APKs
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          echo "All APKs verified successfully."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raymond-v2-8-apks
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
