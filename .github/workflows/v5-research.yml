name: Raymond V5 Complete Research Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Research depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

      start_date:
        description: "Historical data start date"
        required: true
        default: "2024-01-01"
        type: string

      end_date:
        description: "Historical data end date"
        required: true
        default: "2026-10-02"
        type: string


jobs:

  # ========================================================================
  # 1. PREPARE XAUUSD DATA
  # ========================================================================

  prepare-data:
    name: Prepare XAUUSD H1 Data
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      dataset: ${{ steps.prepare.outputs.dataset }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install pandas numpy

          npm install -g dukascopy-node

      - name: Show dukascopy-node version
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DUKASCOPY-NODE VERSION"
          echo "============================================================"

          dukascopy-node --help

          npm list -g dukascopy-node --depth=0

      - name: Create directories
        run: |
          set -euo pipefail

          mkdir -p data/historical
          mkdir -p data/historical/chunks
          mkdir -p backtest_results/weekly_growth_v5

      # ======================================================================
      # MONTHLY XAUUSD DOWNLOAD
      #
      # IMPORTANT:
      # dukascopy-node automatically appends ".csv" to the filename supplied
      # through -fn.
      #
      # Therefore:
      #
      #   -fn xauusd_h1_2024-01-01_2024-02-01
      #
      # produces:
      #
      #   xauusd_h1_2024-01-01_2024-02-01.csv
      #
      # ======================================================================

      - name: Download XAUUSD H1 data in monthly chunks
        shell: bash
        run: |
          set -euo pipefail

          START_DATE="${{ inputs.start_date }}"
          END_DATE="${{ inputs.end_date }}"

          CHUNK_DIR="data/historical/chunks"

          mkdir -p "$CHUNK_DIR"

          echo ""
          echo "============================================================"
          echo "RAYMOND V5 XAUUSD H1 CHUNKED DOWNLOAD"
          echo "============================================================"
          echo "Start: $START_DATE"
          echo "End:   $END_DATE"
          echo "============================================================"
          echo ""

          python - "$START_DATE" "$END_DATE" <<'PY'
          import sys
          import subprocess
          import time
          from datetime import date
          from pathlib import Path


          start_text = sys.argv[1]
          end_text = sys.argv[2]

          start = date.fromisoformat(start_text)
          end = date.fromisoformat(end_text)

          if end <= start:
              raise SystemExit(
                  "End date must be after start date."
              )


          chunk_dir = Path(
              "data/historical/chunks"
          )

          chunk_dir.mkdir(
              parents=True,
              exist_ok=True,
          )


          def next_month(d):
              if d.month == 12:
                  return date(
                      d.year + 1,
                      1,
                      1,
                  )

              return date(
                  d.year,
                  d.month + 1,
                  1,
              )


          current = date(
              start.year,
              start.month,
              1,
          )

          chunk_number = 0


          while current < end:

              month_end = next_month(current)

              chunk_from = max(
                  current,
                  start,
              )

              chunk_to = min(
                  month_end,
                  end,
              )

              if chunk_to <= chunk_from:
                  break


              chunk_number += 1

              from_text = chunk_from.isoformat()
              to_text = chunk_to.isoformat()

              filename_base = (
                  "xauusd_h1_"
                  f"{from_text}_"
                  f"{to_text}"
              )

              output_path = (
                  chunk_dir /
                  f"{filename_base}.csv"
              )

              malformed_path = (
                  chunk_dir /
                  f"{filename_base}.csv.csv"
              )


              print("")
              print("=" * 60)
              print(
                  f"MONTHLY CHUNK {chunk_number}"
              )
              print("=" * 60)
              print(
                  f"From: {from_text}"
              )
              print(
                  f"To:   {to_text}"
              )
              print(
                  f"Expected file: {output_path}"
              )
              print("=" * 60)


              # --------------------------------------------------------------
              # Remove malformed legacy filename.
              # --------------------------------------------------------------

              if malformed_path.exists():

                  print(
                      "Removing malformed previous file:"
                  )

                  print(
                      f"  {malformed_path}"
                  )

                  malformed_path.unlink()


              # --------------------------------------------------------------
              # Reuse an already downloaded valid chunk.
              # --------------------------------------------------------------

              if (
                  output_path.exists()
                  and output_path.stat().st_size > 100
              ):

                  print(
                      "Existing valid chunk found."
                  )

                  print(
                      "Skipping download."
                  )

                  current = month_end

                  continue


              # --------------------------------------------------------------
              # IMPORTANT RATE-LIMIT HARDENING
              #
              # -bs 1       = one request batch at a time
              # -bp 10000   = 10 seconds between internal batches
              # -r 12       = 12 internal retries
              # -rp 15000   = 15 seconds between retries
              # -re         = retry empty responses
              # --------------------------------------------------------------

              command = [
                  "dukascopy-node",

                  "-i",
                  "xauusd",

                  "-from",
                  from_text,

                  "-to",
                  to_text,

                  "-t",
                  "h1",

                  "-f",
                  "csv",

                  "-dir",
                  str(chunk_dir),

                  "-fn",
                  filename_base,

                  "-bs",
                  "1",

                  "-bp",
                  "10000",

                  "-r",
                  "12",

                  "-rp",
                  "15000",

                  "-re",
              ]


              print("")
              print("Running:")
              print(" ".join(command))


              successful = False


              # --------------------------------------------------------------
              # OUTER RETRIES
              #
              # First retry waits 3 minutes.
              # Second retry waits 6 minutes.
              #
              # This is specifically intended to reduce HTTP 429 failures.
              # --------------------------------------------------------------

              for attempt in range(1, 4):

                  print("")
                  print(
                      f"Outer attempt {attempt}/3"
                  )


                  result = subprocess.run(
                      command,
                      check=False,
                  )


                  # ----------------------------------------------------------
                  # Accept ONLY a valid correctly named file.
                  # ----------------------------------------------------------

                  if (
                      result.returncode == 0
                      and output_path.exists()
                      and output_path.stat().st_size > 100
                  ):

                      print("")
                      print(
                          "DOWNLOAD SUCCESS"
                      )

                      print(
                          f"Valid file: "
                          f"{output_path}"
                      )

                      print(
                          f"Size: "
                          f"{output_path.stat().st_size:,} bytes"
                      )

                      successful = True

                      break


                  print("")
                  print(
                      "Chunk download did not produce "
                      "the expected valid file."
                  )


                  # ----------------------------------------------------------
                  # Recover legacy .csv.csv output if produced.
                  # ----------------------------------------------------------

                  if (
                      not output_path.exists()
                      and malformed_path.exists()
                      and malformed_path.stat().st_size > 100
                  ):

                      print("")
                      print(
                          "Detected legacy .csv.csv output."
                      )

                      print(
                          "Renaming it to the correct .csv filename."
                      )

                      malformed_path.rename(
                          output_path
                      )

                      successful = True

                      break


                  if attempt < 3:

                      wait_seconds = (
                          180
                          if attempt == 1
                          else 360
                      )

                      print(
                          f"Waiting "
                          f"{wait_seconds} seconds "
                          f"before retry..."
                      )

                      time.sleep(
                          wait_seconds
                      )


              if not successful:

                  raise SystemExit(
                      "Failed to download "
                      f"XAUUSD chunk "
                      f"{from_text} -> {to_text}"
                  )


              print("")
              print(
                  f"Chunk {chunk_number} "
                  "completed successfully."
              )


              # --------------------------------------------------------------
              # IMPORTANT:
              # Wait 45 seconds between successful monthly requests.
              # --------------------------------------------------------------

              print(
                  "Waiting 45 seconds "
                  "before next monthly request..."
              )

              time.sleep(45)


              current = month_end


          # ==================================================================
          # DOWNLOAD COMPLETE
          # ==================================================================

          print("")
          print("=" * 60)
          print(
              "ALL MONTHLY DOWNLOADS COMPLETED"
          )
          print("=" * 60)
          print("")


          files = sorted(
              chunk_dir.glob("*.csv")
          )


          malformed_files = sorted(
              chunk_dir.glob("*.csv.csv")
          )


          if malformed_files:

              print(
                  "WARNING: malformed .csv.csv files found:"
              )

              for path in malformed_files:

                  print(
                      f"  {path}"
                  )


          if not files:

              raise SystemExit(
                  "No monthly XAUUSD CSV files found."
              )


          total_bytes = 0


          for path in files:

              size = path.stat().st_size

              total_bytes += size

              print(
                  f"{path.name}: "
                  f"{size:,} bytes"
              )


          print("")

          print(
              f"Chunk files: {len(files)}"
          )

          print(
              f"Total size: "
              f"{total_bytes:,} bytes"
          )

      - name: Inspect downloaded chunks
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "DOWNLOADED XAUUSD CHUNKS"
          echo "============================================================"

          find data/historical/chunks \
            -maxdepth 1 \
            -type f \
            -name "*.csv" \
            -print \
            -exec ls -lh {} \;

          echo ""

          MALFORMED_COUNT="$(
            find data/historical/chunks \
              -maxdepth 1 \
              -type f \
              -name "*.csv.csv" \
              | wc -l
          )"

          echo "Malformed .csv.csv files: $MALFORMED_COUNT"

          if [ "$MALFORMED_COUNT" -gt 0 ]; then
            echo "ERROR: malformed duplicate-extension files remain."
            exit 1
          fi

          COUNT="$(
            find data/historical/chunks \
              -maxdepth 1 \
              -type f \
              -name "*.csv" \
              | wc -l
          )"

          echo "Valid chunk count: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "No valid chunk files were downloaded."
            exit 1
          fi

      # ======================================================================
      # COMBINE AND NORMALIZE
      # ======================================================================

      - name: Normalize and combine XAUUSD H1 chunks
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd


          chunk_dir = Path(
              "data/historical/chunks"
          )

          output = Path(
              "data/historical/"
              "xauusd_h1_2024_2026_normalized.csv"
          )


          files = sorted(
              chunk_dir.glob("*.csv")
          )


          if not files:

              raise SystemExit(
                  "No XAUUSD chunk CSV files found."
              )


          print("")
          print("=" * 60)
          print(
              "COMBINING XAUUSD H1 CHUNKS"
          )
          print("=" * 60)

          print(
              f"Chunk files: {len(files)}"
          )


          frames = []


          for path in files:

              print(
                  f"Reading: {path}"
              )

              try:

                  frame = pd.read_csv(
                      path
                  )

              except Exception as exc:

                  raise SystemExit(
                      f"Could not read {path}: "
                      f"{exc}"
                  )

              if frame.empty:

                  print(
                      f"WARNING: {path} is empty."
                  )

                  continue

              print(
                  f"  Rows: {len(frame):,}"
              )

              frames.append(
                  frame
              )


          if not frames:

              raise SystemExit(
                  "All downloaded chunks were empty."
              )


          df = pd.concat(
              frames,
              ignore_index=True,
          )


          print("")
          print(
              f"Combined raw rows: "
              f"{len(df):,}"
          )


          # ==================================================================
          # NORMALIZE COLUMN NAMES
          # ==================================================================

          rename = {}


          for column in df.columns:

              key = (
                  str(column)
                  .strip()
                  .lower()
              )

              if key in {
                  "time",
                  "timestamp",
                  "date",
                  "datetime",
              }:

                  rename[column] = "timestamp"

              elif key in {
                  "open",
                  "o",
              }:

                  rename[column] = "open"

              elif key in {
                  "high",
                  "h",
              }:

                  rename[column] = "high"

              elif key in {
                  "low",
                  "l",
              }:

                  rename[column] = "low"

              elif key in {
                  "close",
                  "c",
              }:

                  rename[column] = "close"

              elif key in {
                  "volume",
                  "vol",
                  "v",
              }:

                  rename[column] = "volume"


          df = df.rename(
              columns=rename
          )


          required = [
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          ]


          missing = [
              column
              for column in required
              if column not in df.columns
          ]


          if missing:

              raise SystemExit(
                  "Missing required columns: "
                  f"{missing}"
              )


          # ==================================================================
          # TIMESTAMP
          # ==================================================================

          timestamp_numeric = pd.to_numeric(
              df["timestamp"],
              errors="coerce",
          )


          numeric_ratio = (
              timestamp_numeric.notna().mean()
          )


          if numeric_ratio > 0.95:

              df["timestamp"] = pd.to_datetime(
                  timestamp_numeric,
                  unit="ms",
                  utc=True,
                  errors="coerce",
              )

          else:

              df["timestamp"] = pd.to_datetime(
                  df["timestamp"],
                  utc=True,
                  errors="coerce",
              )


          # ==================================================================
          # NUMERIC OHLC
          # ==================================================================

          for column in [
              "open",
              "high",
              "low",
              "close",
          ]:

              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )


          if "volume" not in df.columns:

              df["volume"] = 0.0

          else:

              df["volume"] = pd.to_numeric(
                  df["volume"],
                  errors="coerce",
              ).fillna(0.0)


          # ==================================================================
          # REMOVE INVALID ROWS
          # ==================================================================

          before_drop = len(df)


          df = df.dropna(
              subset=required
          )


          removed = (
              before_drop -
              len(df)
          )


          print(
              f"Invalid rows removed: "
              f"{removed:,}"
          )


          # ==================================================================
          # SORT AND DEDUPLICATE
          # ==================================================================

          df = df.sort_values(
              "timestamp"
          )


          before_duplicates = len(df)


          df = df.drop_duplicates(
              subset=["timestamp"],
              keep="first",
          )


          duplicate_count = (
              before_duplicates -
              len(df)
          )


          print(
              f"Duplicate candles removed: "
              f"{duplicate_count:,}"
          )


          df = df.reset_index(
              drop=True
          )


          # ==================================================================
          # OHLC INTEGRITY
          # ==================================================================

          invalid_high_low = (
              df["high"] <
              df["low"]
          )


          invalid_open = (
              (df["open"] > df["high"]) |
              (df["open"] < df["low"])
          )


          invalid_close = (
              (df["close"] > df["high"]) |
              (df["close"] < df["low"])
          )


          if invalid_high_low.any():

              count = int(
                  invalid_high_low.sum()
              )

              raise SystemExit(
                  f"Found {count} candles "
                  "where High < Low."
              )


          if invalid_open.any():

              count = int(
                  invalid_open.sum()
              )

              raise SystemExit(
                  f"Found {count} candles "
                  "where Open is outside "
                  "High/Low."
              )


          if invalid_close.any():

              count = int(
                  invalid_close.sum()
              )

              raise SystemExit(
                  f"Found {count} candles "
                  "where Close is outside "
                  "High/Low."
              )


          # ==================================================================
          # TIMESTAMP INTEGRITY
          # ==================================================================

          if df["timestamp"].isna().any():

              raise SystemExit(
                  "Invalid timestamps remain."
              )


          if not df[
              "timestamp"
          ].is_monotonic_increasing:

              raise SystemExit(
                  "Timestamps are not "
                  "monotonic increasing."
              )


          if df[
              "timestamp"
          ].duplicated().any():

              raise SystemExit(
                  "Duplicate timestamps remain."
              )


          # ==================================================================
          # POSITIVE PRICES
          # ==================================================================

          for column in [
              "open",
              "high",
              "low",
              "close",
          ]:

              if (
                  df[column] <= 0
              ).any():

                  raise SystemExit(
                      f"Non-positive {column} "
                      "values detected."
                  )


          # ==================================================================
          # SAVE
          # ==================================================================

          df.to_csv(
              output,
              index=False,
          )


          print("")
          print("=" * 60)
          print(
              "NORMALIZED XAUUSD H1 DATASET"
          )
          print("=" * 60)

          print(
              f"Rows:       {len(df):,}"
          )

          print(
              f"Start:      "
              f"{df['timestamp'].min()}"
          )

          print(
              f"End:        "
              f"{df['timestamp'].max()}"
          )

          print(
              f"Output:     {output}"
          )

          print(
              "OHLC:       VALID"
          )

          print(
              "Timestamps: VALID"
          )

          print(
              "Duplicates: NONE"
          )

          print("=" * 60)


          if len(df) < 5000:

              raise SystemExit(
                  "Dataset contains fewer "
                  "than 5,000 H1 candles."
              )


          print("")
          print("First 5 candles:")

          print(
              df.head().to_string(
                  index=False
              )
          )


          print("")
          print("Last 5 candles:")

          print(
              df.tail().to_string(
                  index=False
              )
          )

          PY

          echo \
            "dataset=data/historical/xauusd_h1_2024_2026_normalized.csv" \
            >> "$GITHUB_OUTPUT"

      - name: Validate final market dataset
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd


          path = (
              "data/historical/"
              "xauusd_h1_2024_2026_normalized.csv"
          )


          df = pd.read_csv(
              path
          )


          required = [
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          ]


          missing = [
              column
              for column in required
              if column not in df.columns
          ]


          if missing:

              raise SystemExit(
                  f"Missing columns: {missing}"
              )


          df["timestamp"] = pd.to_datetime(
              df["timestamp"],
              utc=True,
              errors="coerce",
          )


          if df[
              "timestamp"
          ].isna().any():

              raise SystemExit(
                  "Invalid timestamps detected."
              )


          if not df[
              "timestamp"
          ].is_monotonic_increasing:

              raise SystemExit(
                  "Timestamps are not "
                  "monotonic increasing."
              )


          if df[
              "timestamp"
          ].duplicated().any():

              raise SystemExit(
                  "Duplicate timestamps detected."
              )


          for column in [
              "open",
              "high",
              "low",
              "close",
          ]:

              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )


              if df[column].isna().any():

                  raise SystemExit(
                      f"Invalid {column} values."
                  )


              if (
                  df[column] <= 0
              ).any():

                  raise SystemExit(
                      f"Non-positive "
                      f"{column} values."
                  )


          if (
              df["high"] <
              df["low"]
          ).any():

              raise SystemExit(
                  "High < Low detected."
              )


          if (
              (df["open"] > df["high"]) |
              (df["open"] < df["low"])
          ).any():

              raise SystemExit(
                  "Open outside candle range."
              )


          if (
              (df["close"] > df["high"]) |
              (df["close"] < df["low"])
          ).any():

              raise SystemExit(
                  "Close outside candle range."
              )


          print("")
          print("=" * 60)
          print(
              "FINAL MARKET DATA VALIDATION: PASS"
          )
          print("=" * 60)

          print(
              f"Rows:  {len(df):,}"
          )

          print(
              f"Start: {df['timestamp'].min()}"
          )

          print(
              f"End:   {df['timestamp'].max()}"
          )

          print(
              "OHLC integrity: PASS"
          )

          print(
              "Timestamp integrity: PASS"
          )

          print(
              "Duplicate timestamps: NONE"
          )

          print("=" * 60)
          PY

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical/xauusd_h1_2024_2026_normalized.csv
          retention-days: 30


  # ========================================================================
  # 2. STRATEGY ENGINE
  # ========================================================================

  strategy-engine:
    name: V5 Strategy Engine
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical

      - name: Run strategy engine
        run: |
          python scripts/v5_strategy_engine.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/strategy_engine

      - name: Upload strategy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-strategy-engine-results
          path: backtest_results/weekly_growth_v5/strategy_engine
          retention-days: 30


  # ========================================================================
  # 3. MULTI OBJECTIVE OPTIMIZER
  # ========================================================================

  optimizer:
    name: V5 Multi Objective Optimizer
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical

      - name: Run quick optimizer
        if: inputs.mode == 'quick'
        run: |
          python scripts/v5_optimizer.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/optimizer \
            --max-candidates 250

      - name: Run full optimizer
        if: inputs.mode == 'full'
        run: |
          python scripts/v5_optimizer.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/optimizer

      - name: Upload optimizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-optimizer-results
          path: backtest_results/weekly_growth_v5/optimizer
          retention-days: 30


  # ========================================================================
  # 4. WALK FORWARD VALIDATION
  # ========================================================================

  walk-forward:
    name: V5 Walk Forward
    needs:
      - prepare-data
      - optimizer

    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical

      - name: Run quick walk forward
        if: inputs.mode == 'quick'
        run: |
          python scripts/v5_walk_forward.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/walk_forward \
            --max-candidates 250

      - name: Run full walk forward
        if: inputs.mode == 'full'
        run: |
          python scripts/v5_walk_forward.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/walk_forward

      - name: Upload walk forward results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-walk-forward-results
          path: backtest_results/weekly_growth_v5/walk_forward
          retention-days: 30


  # ========================================================================
  # 5. ROBUSTNESS ANALYSIS
  # ========================================================================

  robustness:
    name: V5 Robustness Analysis
    needs: walk-forward
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download walk forward results
        uses: actions/download-artifact@v4
        with:
          name: v5-walk-forward-results
          path: backtest_results/weekly_growth_v5/walk_forward

      - name: Run robustness analyzer
        run: |
          python scripts/v5_robustness_analyzer.py \
            --input backtest_results/weekly_growth_v5/walk_forward \
            --output backtest_results/weekly_growth_v5/robustness

      - name: Upload robustness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-robustness-results
          path: backtest_results/weekly_growth_v5/robustness
          retention-days: 30


  # ========================================================================
  # 6. INDEPENDENT RESULTS VALIDATOR
  # ========================================================================

  validator:
    name: V5 Independent Results Validator

    needs:
      - strategy-engine
      - optimizer
      - walk-forward
      - robustness

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Create validation package
        run: |
          mkdir -p validation_package

      - name: Download strategy engine
        uses: actions/download-artifact@v4
        with:
          name: v5-strategy-engine-results
          path: validation_package/strategy_engine

      - name: Download optimizer
        uses: actions/download-artifact@v4
        with:
          name: v5-optimizer-results
          path: validation_package/optimizer

      - name: Download walk forward
        uses: actions/download-artifact@v4
        with:
          name: v5-walk-forward-results
          path: validation_package/walk_forward

      - name: Download robustness
        uses: actions/download-artifact@v4
        with:
          name: v5-robustness-results
          path: validation_package/robustness

      - name: Download market data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: validation_package/market_data

      - name: Run independent validator
        run: |
          python scripts/v5_results_validator.py \
            --input validation_package \
            --output validation_package/validation

      - name: Print validator summary
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "RAYMOND V2.8 V5 VALIDATION RESULT"
          echo "============================================================"
          echo ""

          if [ -f validation_package/validation/summary.txt ]; then
            cat validation_package/validation/summary.txt
          else
            echo "Validator summary was not generated."
          fi

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-validation-results
          path: validation_package/validation
          retention-days: 30


  # ========================================================================
  # 7. FINAL RESEARCH REPORT
  # ========================================================================

  final-report:
    name: V5 Final Research Report
    needs:
      - validator
    runs-on: ubuntu-latest

    steps:

      - name: Download validation results
        uses: actions/download-artifact@v4
        with:
          name: v5-validation-results
          path: final_report/validation

      - name: Download robustness results
        uses: actions/download-artifact@v4
        with:
          name: v5-robustness-results
          path: final_report/robustness

      - name: Download walk forward results
        uses: actions/download-artifact@v4
        with:
          name: v5-walk-forward-results
          path: final_report/walk_forward

      - name: Download optimizer results
        uses: actions/download-artifact@v4
        with:
          name: v5-optimizer-results
          path: final_report/optimizer

      - name: Download strategy engine results
        uses: actions/download-artifact@v4
        with:
          name: v5-strategy-engine-results
          path: final_report/strategy_engine

      - name: Create research README
        run: |
          cat > final_report/README.txt <<'EOF'
          RAYMOND V2.8
          V5 COMPLETE RESEARCH PACKAGE
          =============================

          RESEARCH PIPELINE
          -----------------
          1. XAUUSD H1 data preparation
          2. V5 strategy engine
          3. Multi-objective optimizer
          4. Walk-forward validation
          5. Robustness analysis
          6. Independent results validation

          MARKET
          ------
          Symbol: XAUUSD
          Timeframe: H1

          DATA DOWNLOAD
          -------------
          Historical XAUUSD H1 data is downloaded in monthly chunks
          with rate-limit protection and retries.

          XAUUSD CONTRACT MODEL
          ---------------------
          1.00 lot = 100 ounces.

          P&L = price_difference × 100 × lot_size

          Example:

              2051 -> 2056
              0.02 lot

              5 × 100 × 0.02
              = $10

          LIVE TRADING
          ------------
          Disabled.

          No MT5 orders.
          No Exness orders.
          No live position modification.

          RESEARCH PRINCIPLES
          -------------------
          The strategy is not judged by headline return alone.

          Important measurements include:

              - Out-of-sample return
              - Profit factor
              - Expectancy
              - Win rate
              - Maximum drawdown
              - Consistency
              - Walk-forward degradation
              - Strategy-family stability
              - Regime stability
              - Accounting reconciliation
              - XAUUSD contract correctness

          A very high backtest return without out-of-sample
          stability is not considered a validated edge.

          FINAL DECISION
          --------------
          The independent validation verdict determines whether
          the V5 strategy proceeds to the next research stage.

          No live trading is enabled by this workflow.
          EOF

      - name: Display final result
        run: |
          echo ""
          echo "============================================================"
          echo "RAYMOND V2.8 V5 FINAL RESULT"
          echo "============================================================"
          echo ""

          cat final_report/README.txt

          echo ""
          echo "============================================================"
          echo "VALIDATOR"
          echo "============================================================"

          if [ -f final_report/validation/summary.txt ]; then
            cat final_report/validation/summary.txt
          else
            echo "Validation summary unavailable."
          fi

      - name: GitHub Actions summary
        run: |
          echo "# Raymond V2.8 V5 Final Research Result" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -f final_report/validation/summary.txt ]; then

            echo '```text' \
              >> "$GITHUB_STEP_SUMMARY"

            cat final_report/validation/summary.txt \
              >> "$GITHUB_STEP_SUMMARY"

            echo '```' \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "Validation summary unavailable." \
              >> "$GITHUB_STEP_SUMMARY"

          fi

      - name: Upload complete research package
        uses: actions/upload-artifact@v4
        with:
          name: raymond-v2-8-v5-final-research
          path: final_report
          retention-days: 30
