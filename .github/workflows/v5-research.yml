name: Raymond V5 Complete Research Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Research depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

      start_date:
        description: "Historical data start date"
        required: true
        default: "2024-01-01"
        type: string

      end_date:
        description: "Historical data end date"
        required: true
        default: "2026-10-02"
        type: string


jobs:

  # ========================================================================
  # 1. PREPARE DATA
  # ========================================================================

  prepare-data:
    name: Prepare XAUUSD H1 Data
    runs-on: ubuntu-latest

    timeout-minutes: 60

    outputs:
      dataset: ${{ steps.prepare.outputs.dataset }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          npm install -g dukascopy-node

      - name: Show dukascopy-node version
        run: |
          dukascopy-node --help
          npm list -g dukascopy-node --depth=0

      - name: Create directories
        run: |
          mkdir -p data/historical
          mkdir -p backtest_results/weekly_growth_v5

      # IMPORTANT:
      # dukascopy-node uses -dir / --directory.
      # It does NOT use -o.
      #
      # -fn forces a safe filename and avoids date-generated filenames
      # containing characters that can cause file/path problems.
      - name: Download XAUUSD H1 data
        run: |
          set -e

          dukascopy-node \
            -i xauusd \
            -from "${{ inputs.start_date }}" \
            -to "${{ inputs.end_date }}" \
            -t h1 \
            -f csv \
            -dir data/historical \
            -fn xauusd_h1_download.csv \
            -r 5 \
            -re

      - name: Inspect downloaded files
        run: |
          echo "Downloaded files:"
          find data/historical -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Normalize XAUUSD H1
        id: prepare
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("data/historical")

          files = [
              p for p in root.glob("*.csv")
              if p.name != "xauusd_h1_2024_2026_normalized.csv"
          ]

          if not files:
              raise SystemExit(
                  "No XAUUSD CSV file was downloaded."
              )

          print("CSV files found:")
          for path in files:
              print(f"  - {path}")

          selected = None

          preferred = root / "xauusd_h1_download.csv"

          if preferred.exists():
              selected = preferred
          else:
              for path in files:
                  name = path.name.lower()

                  if "xauusd" in name or "xau" in name:
                      selected = path
                      break

          if selected is None:
              selected = files[0]

          print(f"Using source file: {selected}")

          df = pd.read_csv(selected)

          print("Original columns:")
          print(list(df.columns))

          rename = {}

          for column in df.columns:

              key = str(column).lower().strip()

              if key in {
                  "time",
                  "timestamp",
                  "date",
                  "datetime",
              }:
                  rename[column] = "timestamp"

              elif key in {
                  "open",
                  "o",
              }:
                  rename[column] = "open"

              elif key in {
                  "high",
                  "h",
              }:
                  rename[column] = "high"

              elif key in {
                  "low",
                  "l",
              }:
                  rename[column] = "low"

              elif key in {
                  "close",
                  "c",
              }:
                  rename[column] = "close"

              elif key in {
                  "volume",
                  "vol",
                  "v",
              }:
                  rename[column] = "volume"

          df = df.rename(columns=rename)

          required = [
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          ]

          missing = [
              column
              for column in required
              if column not in df.columns
          ]

          if missing:
              raise SystemExit(
                  f"Missing required columns: {missing}"
              )

          # Dukascopy CSV timestamps may be Unix milliseconds.
          # Convert them safely to UTC.
          timestamp_numeric = pd.to_numeric(
              df["timestamp"],
              errors="coerce",
          )

          numeric_ratio = timestamp_numeric.notna().mean()

          if numeric_ratio > 0.95:
              df["timestamp"] = pd.to_datetime(
                  timestamp_numeric,
                  unit="ms",
                  utc=True,
                  errors="coerce",
              )
          else:
              df["timestamp"] = pd.to_datetime(
                  df["timestamp"],
                  utc=True,
                  errors="coerce",
              )

          for column in [
              "open",
              "high",
              "low",
              "close",
          ]:
              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )

          if "volume" not in df.columns:
              df["volume"] = 0.0

          df["volume"] = pd.to_numeric(
              df["volume"],
              errors="coerce",
          ).fillna(0.0)

          # Remove invalid rows.
          df = df.dropna(
              subset=required
          )

          # Sort chronologically.
          df = df.sort_values(
              "timestamp"
          )

          # Remove duplicate candles.
          df = df.drop_duplicates(
              "timestamp"
          )

          df = df.reset_index(
              drop=True
          )

          # Validate OHLC relationships.
          invalid_high_low = (
              df["high"] < df["low"]
          )

          invalid_open = (
              (df["open"] > df["high"]) |
              (df["open"] < df["low"])
          )

          invalid_close = (
              (df["close"] > df["high"]) |
              (df["close"] < df["low"])
          )

          if invalid_high_low.any():
              raise SystemExit(
                  "Found candles where High < Low."
              )

          if invalid_open.any():
              raise SystemExit(
                  "Found candles where Open is outside High/Low."
              )

          if invalid_close.any():
              raise SystemExit(
                  "Found candles where Close is outside High/Low."
              )

          output = (
              root /
              "xauusd_h1_2024_2026_normalized.csv"
          )

          df.to_csv(
              output,
              index=False,
          )

          print("")
          print("==============================================")
          print("NORMALIZED XAUUSD DATA")
          print("==============================================")
          print(f"Rows: {len(df):,}")
          print(f"Start: {df['timestamp'].min()}")
          print(f"End:   {df['timestamp'].max()}")
          print(f"Output: {output}")
          print("==============================================")

          if len(df) < 5000:
              raise SystemExit(
                  "Dataset has fewer than 5,000 H1 candles."
              )

          print("")
          print("First 5 rows:")
          print(df.head().to_string())

          print("")
          print("Last 5 rows:")
          print(df.tail().to_string())

          print("")
          print("Dataset normalization completed successfully.")
          PY

          echo "dataset=data/historical/xauusd_h1_2024_2026_normalized.csv" \
            >> "$GITHUB_OUTPUT"

      - name: Validate market data
        run: |
          python - <<'PY'
          import pandas as pd

          path = (
              "data/historical/"
              "xauusd_h1_2024_2026_normalized.csv"
          )

          df = pd.read_csv(path)

          required = [
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          ]

          for column in required:
              if column not in df.columns:
                  raise SystemExit(
                      f"Missing column: {column}"
                  )

          df["timestamp"] = pd.to_datetime(
              df["timestamp"],
              utc=True,
              errors="coerce",
          )

          if df["timestamp"].isna().any():
              raise SystemExit(
                  "Invalid timestamps detected."
              )

          if not df["timestamp"].is_monotonic_increasing:
              raise SystemExit(
                  "Timestamps are not monotonic increasing."
              )

          if df["timestamp"].duplicated().any():
              raise SystemExit(
                  "Duplicate timestamps detected."
              )

          for column in [
              "open",
              "high",
              "low",
              "close",
          ]:

              df[column] = pd.to_numeric(
                  df[column],
                  errors="coerce",
              )

              if df[column].isna().any():
                  raise SystemExit(
                      f"Invalid {column} values detected."
                  )

              if (df[column] <= 0).any():
                  raise SystemExit(
                      f"Non-positive {column} values detected."
                  )

          if (df["high"] < df["low"]).any():
              raise SystemExit(
                  "Found High < Low candle."
              )

          if (
              (df["open"] > df["high"]) |
              (df["open"] < df["low"])
          ).any():
              raise SystemExit(
                  "Found Open outside candle range."
              )

          if (
              (df["close"] > df["high"]) |
              (df["close"] < df["low"])
          ).any():
              raise SystemExit(
                  "Found Close outside candle range."
              )

          print("")
          print("==============================================")
          print("MARKET DATA VALIDATION")
          print("==============================================")
          print(f"Validated {len(df):,} XAUUSD H1 candles.")
          print(f"First candle: {df['timestamp'].min()}")
          print(f"Last candle:  {df['timestamp'].max()}")
          print("OHLC integrity: PASS")
          print("Timestamp integrity: PASS")
          print("==============================================")
          PY

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical/xauusd_h1_2024_2026_normalized.csv
          retention-days: 30


  # ========================================================================
  # 2. STRATEGY ENGINE
  # ========================================================================

  strategy-engine:
    name: V5 Strategy Engine
    needs: prepare-data
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical

      - name: Run strategy engine
        run: |
          python scripts/v5_strategy_engine.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/strategy_engine

      - name: Upload strategy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-strategy-engine-results
          path: backtest_results/weekly_growth_v5/strategy_engine
          retention-days: 30


  # ========================================================================
  # 3. MULTI OBJECTIVE OPTIMIZER
  # ========================================================================

  optimizer:
    name: V5 Multi Objective Optimizer
    needs: prepare-data
    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical

      - name: Run quick optimizer
        if: inputs.mode == 'quick'
        run: |
          python scripts/v5_optimizer.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/optimizer \
            --max-candidates 250

      - name: Run full optimizer
        if: inputs.mode == 'full'
        run: |
          python scripts/v5_optimizer.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/optimizer

      - name: Upload optimizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-optimizer-results
          path: backtest_results/weekly_growth_v5/optimizer
          retention-days: 30


  # ========================================================================
  # 4. WALK FORWARD VALIDATION
  # ========================================================================

  walk-forward:
    name: V5 Walk Forward
    needs:
      - prepare-data
      - optimizer

    runs-on: ubuntu-latest

    timeout-minutes: 240

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: data/historical

      - name: Run quick walk forward
        if: inputs.mode == 'quick'
        run: |
          python scripts/v5_walk_forward.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/walk_forward \
            --max-candidates 250

      - name: Run full walk forward
        if: inputs.mode == 'full'
        run: |
          python scripts/v5_walk_forward.py \
            --data data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output backtest_results/weekly_growth_v5/walk_forward

      - name: Upload walk forward results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-walk-forward-results
          path: backtest_results/weekly_growth_v5/walk_forward
          retention-days: 30


  # ========================================================================
  # 5. ROBUSTNESS ANALYSIS
  # ========================================================================

  robustness:
    name: V5 Robustness Analysis
    needs: walk-forward

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download walk forward results
        uses: actions/download-artifact@v4
        with:
          name: v5-walk-forward-results
          path: backtest_results/weekly_growth_v5/walk_forward

      - name: Run robustness analyzer
        run: |
          python scripts/v5_robustness_analyzer.py \
            --input backtest_results/weekly_growth_v5/walk_forward \
            --output backtest_results/weekly_growth_v5/robustness

      - name: Upload robustness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-robustness-results
          path: backtest_results/weekly_growth_v5/robustness
          retention-days: 30


  # ========================================================================
  # 6. INDEPENDENT RESULTS VALIDATOR
  # ========================================================================

  validator:
    name: V5 Independent Results Validator

    needs:
      - strategy-engine
      - optimizer
      - walk-forward
      - robustness

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Create validation package
        run: |
          mkdir -p validation_package

      - name: Download strategy engine
        uses: actions/download-artifact@v4
        with:
          name: v5-strategy-engine-results
          path: validation_package/strategy_engine

      - name: Download optimizer
        uses: actions/download-artifact@v4
        with:
          name: v5-optimizer-results
          path: validation_package/optimizer

      - name: Download walk forward
        uses: actions/download-artifact@v4
        with:
          name: v5-walk-forward-results
          path: validation_package/walk_forward

      - name: Download robustness
        uses: actions/download-artifact@v4
        with:
          name: v5-robustness-results
          path: validation_package/robustness

      - name: Download market data
        uses: actions/download-artifact@v4
        with:
          name: v5-prepared-xauusd-data
          path: validation_package/market_data

      - name: Run independent validator
        run: |
          python scripts/v5_results_validator.py \
            --input validation_package \
            --output validation_package/validation

      - name: Print validator summary
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "RAYMOND V2.8 V5 VALIDATION RESULT"
          echo "============================================================"
          echo ""

          if [ -f validation_package/validation/summary.txt ]; then
            cat validation_package/validation/summary.txt
          else
            echo "Validator summary was not generated."
          fi

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-validation-results
          path: validation_package/validation
          retention-days: 30


  # ========================================================================
  # 7. FINAL RESEARCH REPORT
  # ========================================================================

  final-report:
    name: V5 Final Research Report

    needs:
      - validator

    runs-on: ubuntu-latest

    steps:

      - name: Download validation results
        uses: actions/download-artifact@v4
        with:
          name: v5-validation-results
          path: final_report/validation

      - name: Download robustness results
        uses: actions/download-artifact@v4
        with:
          name: v5-robustness-results
          path: final_report/robustness

      - name: Download walk forward results
        uses: actions/download-artifact@v4
        with:
          name: v5-walk-forward-results
          path: final_report/walk_forward

      - name: Download optimizer results
        uses: actions/download-artifact@v4
        with:
          name: v5-optimizer-results
          path: final_report/optimizer

      - name: Download strategy engine results
        uses: actions/download-artifact@v4
        with:
          name: v5-strategy-engine-results
          path: final_report/strategy_engine

      - name: Create research README
        run: |
          cat > final_report/README.txt <<'EOF'
          RAYMOND V2.8
          V5 COMPLETE RESEARCH PACKAGE
          =============================

          RESEARCH PIPELINE
          -----------------
          1. XAUUSD H1 data preparation
          2. V5 strategy engine
          3. Multi-objective optimizer
          4. Walk-forward validation
          5. Robustness analysis
          6. Independent results validation

          MARKET
          ------
          Symbol: XAUUSD
          Timeframe: H1

          XAUUSD CONTRACT MODEL
          ---------------------
          1.00 lot = 100 ounces.

          Therefore:

              P&L =
              price_difference
              × 100
              × lot_size

          Example:

              2051 -> 2056
              0.02 lot

              5 × 100 × 0.02
              = $10

          LIVE TRADING
          ------------
          Disabled.

          No MT5 orders.
          No Exness orders.
          No live position modification.

          RESEARCH PRINCIPLES
          -------------------
          The system must not judge the strategy using
          headline return alone.

          Important measurements include:

              - Out-of-sample return
              - Profit factor
              - Expectancy
              - Win rate
              - Maximum drawdown
              - Consistency
              - Walk-forward degradation
              - Strategy-family stability
              - Regime stability
              - Accounting reconciliation
              - XAUUSD contract correctness

          A very high backtest return without out-of-sample
          stability is not considered a validated edge.

          IMPORTANT FILES
          ---------------
          validation/summary.txt

          validation/v5_results_validation.json

          robustness/summary.txt

          walk_forward/v5_walk_forward_windows.csv

          optimizer/

          FINAL DECISION
          --------------
          The independent validation verdict determines whether
          the V5 strategy proceeds to the next research stage.

          No live trading is enabled by this workflow.
          EOF

      - name: Display final result
        run: |
          echo ""
          echo "============================================================"
          echo "RAYMOND V2.8 V5 FINAL RESULT"
          echo "============================================================"
          echo ""

          cat final_report/README.txt

          echo ""
          echo "============================================================"
          echo "VALIDATOR"
          echo "============================================================"

          if [ -f final_report/validation/summary.txt ]; then
            cat final_report/validation/summary.txt
          else
            echo "Validation summary unavailable."
          fi

      - name: GitHub Actions summary
        run: |
          echo "# Raymond V2.8 V5 Final Research Result" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -f final_report/validation/summary.txt ]; then

            echo '```text' \
              >> "$GITHUB_STEP_SUMMARY"

            cat final_report/validation/summary.txt \
              >> "$GITHUB_STEP_SUMMARY"

            echo '```' \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "Validation summary unavailable." \
              >> "$GITHUB_STEP_SUMMARY"

          fi

      - name: Upload complete research package
        uses: actions/upload-artifact@v4
        with:
          name: raymond-v2-8-v5-final-research
          path: final_report
          retention-days: 30
