name: Raymond Weekly Growth V2 Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-growth-v2:

    name: Weekly Growth V2 - Walk Forward

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout Raymond v2.8
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download XAUUSD H1 data
        run: |

          set -euo pipefail

          rm -rf data/historical

          mkdir -p data/historical

          for YEAR in 2024 2025 2026
          do

            if [ "$YEAR" = "2024" ]; then
              FROM="2024-01-01"
              TO="2025-01-01"

            elif [ "$YEAR" = "2025" ]; then
              FROM="2025-01-01"
              TO="2026-01-01"

            else
              FROM="2026-01-01"
              TO="2026-10-01"
            fi

            mkdir -p "data/historical/$YEAR"

            npx --yes dukascopy-node \
              -i xauusd \
              -from "$FROM" \
              -to "$TO" \
              -t h1 \
              -f csv \
              -dir "data/historical/$YEAR" \
              -bs 5 \
              -bp 1000

          done

      - name: Normalize data
        run: |

          python - <<'PY'

          from pathlib import Path
          import pandas as pd

          root = Path("data/historical")

          target = (
              root /
              "xauusd_h1_2024_2026_normalized.csv"
          )

          files = sorted(
              p
              for p in root.rglob("*.csv")
              if p != target
              and p.stat().st_size > 1000
          )

          frames = []

          for source in files:

              df = pd.read_csv(source)

              rename = {}

              for column in df.columns:

                  name = str(column).strip().lower()

                  if name in {
                      "date",
                      "datetime",
                      "time",
                      "timestamp",
                  }:
                      rename[column] = "timestamp"

                  elif name in {"open", "o"}:
                      rename[column] = "open"

                  elif name in {"high", "h"}:
                      rename[column] = "high"

                  elif name in {"low", "l"}:
                      rename[column] = "low"

                  elif name in {"close", "c"}:
                      rename[column] = "close"

                  elif name in {
                      "volume",
                      "vol",
                      "tick_volume",
                  }:
                      rename[column] = "volume"

              df = df.rename(
                  columns=rename
              )

              if "volume" not in df.columns:
                  df["volume"] = 0.0

              frames.append(
                  df[
                      [
                          "timestamp",
                          "open",
                          "high",
                          "low",
                          "close",
                          "volume",
                      ]
                  ]
              )

          if not frames:
              raise SystemExit(
                  "No historical CSV files found."
              )

          out = pd.concat(
              frames,
              ignore_index=True,
          )

          out["timestamp"] = pd.to_datetime(
              out["timestamp"],
              errors="coerce",
              utc=True,
          )

          for column in [
              "open",
              "high",
              "low",
              "close",
              "volume",
          ]:

              out[column] = pd.to_numeric(
                  out[column],
                  errors="coerce",
              )

          out = out.dropna(
              subset=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
              ]
          )

          out = (
              out
              .sort_values("timestamp")
              .drop_duplicates(
                  "timestamp",
                  keep="last",
              )
          )

          start = pd.Timestamp(
              "2024-01-01",
              tz="UTC",
          )

          end = pd.Timestamp(
              "2026-10-01",
              tz="UTC",
          )

          out = out[
              (out["timestamp"] >= start)
              &
              (out["timestamp"] < end)
          ]

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          out.to_csv(
              target,
              index=False,
          )

          print(
              "Rows:",
              len(out),
          )

          print(
              "First:",
              out["timestamp"].min(),
          )

          print(
              "Last:",
              out["timestamp"].max(),
          )

          PY

      - name: Run V2 walk-forward research
        run: |

          python \
            scripts/run_weekly_growth_v2_backtest.py \
            data/historical/xauusd_h1_2024_2026_normalized.csv \
            backtest_results/weekly_growth_v2

      - name: Print result
        if: always()
        run: |

          if [ \
            -f \
            backtest_results/weekly_growth_v2/summary.txt \
          ]; then

            cat \
              backtest_results/weekly_growth_v2/summary.txt

          fi

      - name: Upload V2 results
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: raymond-weekly-growth-v2-results

          path: |
            backtest_results/weekly_growth_v2/

          if-no-files-found: warn

          retention-days: 14
