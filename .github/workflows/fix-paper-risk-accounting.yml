name: Validate Paper Account Changes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-paper-account-changes
  cancel-in-progress: false

jobs:
  validate:
    name: Validate feature branch safely
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch only
        uses: actions/checkout@v4
        with:
          ref: feature/isolated-user-paper-accounts
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify repository and branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$(git branch --show-current)"
          echo "Checked out branch: ${BRANCH}"

          test "${BRANCH}" = "feature/isolated-user-paper-accounts"

          echo "Feature branch verified."

      - name: Verify ownership implementation files
        shell: bash
        run: |
          set -euo pipefail

          test -f backend/app/position_repository.py
          test -f backend/app/models.py
          test -f backend/app/position_ownership_integration.py
          test -f backend/app/user_positions_api.py
          test -f backend/app/user_auth.py

          echo "Required ownership files exist."

      - name: Compile backend Python files
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q backend/app

          echo "Python compilation passed."

      - name: Install test dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run paper-account regression tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/test_paper_position_manager.py ]; then
            pytest -q app/test_paper_position_manager.py
          fi

          if [ -f app/test_persistent_paper_risk.py ]; then
            pytest -q app/test_persistent_paper_risk.py
          fi

      - name: Check patch formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo "Formatting check passed."

      - name: Verify paper-only safety markers
        shell: bash
        run: |
          set -euo pipefail

          grep -q "This module is PAPER ONLY" \
            backend/app/canonical_paper_runtime.py

          grep -q "broker_order_required: bool = False" \
            backend/app/advanced_trade_management.py

          grep -q 'execution_type: str = "paper"' \
            backend/app/advanced_trade_management.py

          echo "Paper-only safety markers verified."

      - name: Confirm no files were changed
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected working-tree changes detected."
            git status --short
            exit 1
          fi

          echo "Validation completed without modifying repository files."
