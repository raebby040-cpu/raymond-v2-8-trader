name: Monthly Trade Audit + Price-Path Forensics

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to audit (YYYY-MM)"
        required: true
        default: "2026-09"

permissions:
  contents: read

jobs:
  monthly-trade-audit:
    name: Monthly Trade Audit + Price-Path Forensics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Prepare directories
        run: |
          mkdir -p audit_output
          mkdir -p forensic_output
          mkdir -p raw_m5
          mkdir -p normalized_m5

      # ============================================================
      # SAFETY
      # ============================================================

      - name: Verify research-only environment
        run: |
          echo "=================================================="
          echo "RAYMOND V2.8 RESEARCH-ONLY MONTHLY AUDIT"
          echo "=================================================="
          echo ""
          echo "This workflow:"
          echo "- DOES NOT place trades"
          echo "- DOES NOT modify positions"
          echo "- DOES NOT modify the live strategy"
          echo "- DOES NOT promote research candidates"
          echo "- DOES NOT deploy anything"
          echo "- DOES NOT call broker execution APIs"
          echo ""
          echo "Purpose:"
          echo "- Monthly trade audit"
          echo "- Historical accounting verification"
          echo "- Price-path forensic reconstruction"
          echo "- MFE / MAE analysis"
          echo "- Loss reversal analysis"
          echo ""
          echo "=================================================="

      # ============================================================
      # CALCULATE AUDIT DATES
      # ============================================================

      - name: Calculate audit dates
        id: dates
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime

          month = os.environ["AUDIT_MONTH"]

          if len(month) != 7:
              raise SystemExit(
                  "ERROR: Month must use YYYY-MM format."
              )

          start = datetime.strptime(
              month + "-01",
              "%Y-%m-%d",
          )

          if start.month == 12:
              next_month = datetime(
                  start.year + 1,
                  1,
                  1,
              )
          else:
              next_month = datetime(
                  start.year,
                  start.month + 1,
                  1,
              )

          start_str = start.strftime("%Y-%m-%d")
          end_str = next_month.strftime("%Y-%m-%d")

          print(f"Audit month: {month}")
          print(f"M5 start:    {start_str}")
          print(f"M5 end:      {end_str}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
          ) as f:
              f.write(f"start={start_str}\n")
              f.write(f"end={end_str}\n")
          PY

      # ============================================================
      # DOWNLOAD MONTHLY AUDIT
      #
      # IMPORTANT:
      #
      # include_trades=true is intentional.
      #
      # The normal API hides individual trades.
      # The research forensic workflow explicitly requests them
      # so the price-path analyzer can reconstruct each trade.
      #
      # This remains read-only and research-only.
      # ============================================================

      - name: Download monthly audit from Render
        env:
          AUDIT_MONTH: ${{ inputs.month }}
          RENDER_URL: "https://raymond-v2-8-trader.onrender.com"
        run: |
          echo "=================================================="
          echo "DOWNLOADING MONTHLY AUDIT"
          echo "=================================================="
          echo "Month: ${AUDIT_MONTH}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --max-time 180 \
            "${RENDER_URL}/api/research/monthly-audit?month=${AUDIT_MONTH}&include_trades=true" \
            -o audit_output/monthly_trade_audit.json

          test -s audit_output/monthly_trade_audit.json

          echo ""
          echo "Monthly audit downloaded successfully."

      # ============================================================
      # VALIDATE MONTHLY AUDIT
      # ============================================================

      - name: Validate monthly audit
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "audit_output/monthly_trade_audit.json"
          expected_month = os.environ["AUDIT_MONTH"]

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as f:
              report = json.load(f)

          print("==================================================")
          print("MONTHLY AUDIT VALIDATION")
          print("==================================================")

          print(
              "Report type:",
              report.get("report_type"),
          )

          print(
              "Report version:",
              report.get("version"),
          )

          print(
              "Month:",
              report.get("month"),
          )

          print(
              "Research only:",
              report.get("research_only"),
          )

          print(
              "Live trading changed:",
              report.get("live_trading_changed"),
          )

          print(
              "Accounting reconciled:",
              report.get("accounting", {}).get(
                  "accounting_reconciled"
              ),
          )

          if report.get("report_type") != (
              "RAYMOND_MONTHLY_TRADE_AUDIT"
          ):
              raise SystemExit(
                  "ERROR: Unexpected monthly audit report type."
              )

          if report.get("month") != expected_month:
              raise SystemExit(
                  f"ERROR: Report month "
                  f"{report.get('month')} "
                  f"does not match requested month "
                  f"{expected_month}."
              )

          if report.get("research_only") is not True:
              raise SystemExit(
                  "ERROR: Monthly audit is not "
                  "marked research_only=true."
              )

          if report.get("live_trading_changed") is not False:
              raise SystemExit(
                  "ERROR: Audit reports that "
                  "live trading changed."
              )

          if (
              report.get("accounting", {}).get(
                  "accounting_reconciled"
              )
              is not True
          ):
              raise SystemExit(
                  "ERROR: Historical accounting "
                  "is not reconciled."
              )

          trades = report.get("trades")

          if not isinstance(trades, list):
              raise SystemExit(
                  "ERROR: trades field is not a list."
              )

          print("")
          print(
              f"Trade records available for forensics: "
              f"{len(trades)}"
          )

          if len(trades) == 0:
              raise SystemExit(
                  "ERROR: No trade records were returned. "
                  "The forensic workflow requires "
                  "include_trades=true."
              )

          performance = report.get(
              "performance",
              {},
          )

          expected_trades = performance.get(
              "total_trades"
          )

          print(
              f"Audit performance trade count: "
              f"{expected_trades}"
          )

          if (
              isinstance(expected_trades, int)
              and expected_trades != len(trades)
          ):
              raise SystemExit(
                  "ERROR: Trade record count does not "
                  "match performance total_trades."
              )

          print("")
          print(
              "Monthly audit validation PASSED."
          )
          print(
              "Trade records are available for "
              "price-path forensic reconstruction."
          )
          print("==================================================")
          PY

      # ============================================================
      # PRINT AUDIT SUMMARY
      # ============================================================

      - name: Print monthly audit summary
        run: |
          python - <<'PY'
          import json

          path = "audit_output/monthly_trade_audit.json"

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as f:
              report = json.load(f)

          performance = report.get(
              "performance",
              {}
          )

          accounting = report.get(
              "accounting",
              {}
          )

          print("")
          print("==================================================")
          print("RAYMOND V2.8 MONTHLY AUDIT BASELINE")
          print("==================================================")

          print(
              f"Month:             {report.get('month')}"
          )

          print(
              f"Trades:            "
              f"{performance.get('total_trades')}"
          )

          print(
              f"Wins:              "
              f"{performance.get('wins')}"
          )

          print(
              f"Losses:            "
              f"{performance.get('losses')}"
          )

          print(
              f"Win rate:          "
              f"{performance.get('win_rate')}"
          )

          print(
              f"Corrected P/L:     "
              f"{performance.get('total_pnl')}"
          )

          print(
              f"Profit factor:     "
              f"{performance.get('profit_factor')}"
          )

          print(
              f"Accounting fixed:  "
              f"{accounting.get('accounting_reconciled')}"
          )

          print(
              f"Trade records:     "
              f"{len(report.get('trades', []))}"
          )

          print("==================================================")

      # ============================================================
      # DOWNLOAD XAUUSD M5 MARKET DATA
      # ============================================================

      - name: Download XAUUSD M5 market data
        env:
          START_DATE: ${{ steps.dates.outputs.start }}
          END_DATE: ${{ steps.dates.outputs.end }}
        run: |
          echo "=================================================="
          echo "DOWNLOADING XAUUSD M5 MARKET DATA"
          echo "=================================================="
          echo "From: ${START_DATE}"
          echo "To:   ${END_DATE}"
          echo ""

          npx --yes dukascopy-node \
            -i xauusd \
            -from "${START_DATE}" \
            -to "${END_DATE}" \
            -t m5 \
            -f csv \
            -dir raw_m5 \
            -bs 5 \
            -bp 1000

          echo ""
          echo "Downloaded M5 files:"
          find raw_m5 \
            -type f \
            -maxdepth 5 \
            -print

      # ============================================================
      # NORMALIZE M5 MARKET DATA
      #
      # Detect:
      # - nanoseconds
      # - microseconds
      # - milliseconds
      # - seconds
      #
      # Prevents the previous 1970 timestamp problem.
      # ============================================================

      - name: Normalize M5 market data
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          month = os.environ["AUDIT_MONTH"]

          raw_dir = Path("raw_m5")

          output = Path(
              f"normalized_m5/"
              f"xauusd_m5_{month}_normalized.csv"
          )

          files = sorted(
              raw_dir.rglob("*.csv")
          )

          if not files:
              raise SystemExit(
                  "ERROR: No M5 CSV files were downloaded."
              )

          print(
              f"Found {len(files)} raw M5 CSV files."
          )

          frames = []

          for file in files:
              try:
                  df = pd.read_csv(file)
              except Exception as exc:
                  print(
                      f"Skipping unreadable file "
                      f"{file}: {exc}"
                  )
                  continue

              if df.empty:
                  continue

              original_columns = list(
                  df.columns
              )

              # --------------------------------------------------
              # NORMALIZE COLUMN NAMES
              # --------------------------------------------------

              normalized_columns = {}

              for column in df.columns:
                  key = (
                      str(column)
                      .strip()
                      .lower()
                      .replace(" ", "_")
                      .replace("-", "_")
                  )

                  normalized_columns[column] = key

              df = df.rename(
                  columns=normalized_columns
              )

              # --------------------------------------------------
              # FIND TIMESTAMP COLUMN
              # --------------------------------------------------

              timestamp_column = None

              for candidate in (
                  "timestamp",
                  "time",
                  "datetime",
                  "date",
                  "timestamp_utc",
              ):
                  if candidate in df.columns:
                      timestamp_column = candidate
                      break

              if timestamp_column is None:
                  print(
                      f"Skipping {file}: "
                      f"no timestamp column. "
                      f"Columns={original_columns}"
                  )
                  continue

              # --------------------------------------------------
              # FIND OHLC COLUMNS
              # --------------------------------------------------

              aliases = {
                  "open": [
                      "open",
                      "o",
                  ],
                  "high": [
                      "high",
                      "h",
                  ],
                  "low": [
                      "low",
                      "l",
                  ],
                  "close": [
                      "close",
                      "c",
                  ],
                  "volume": [
                      "volume",
                      "vol",
                      "v",
                  ],
              }

              rename = {}

              for target, candidates in aliases.items():
                  for candidate in candidates:
                      if candidate in df.columns:
                          rename[candidate] = target
                          break

              df = df.rename(
                  columns=rename
              )

              required = [
                  "open",
                  "high",
                  "low",
                  "close",
              ]

              if any(
                  column not in df.columns
                  for column in required
              ):
                  print(
                      f"Skipping {file}: "
                      f"missing OHLC columns. "
                      f"Columns={list(df.columns)}"
                  )
                  continue

              # --------------------------------------------------
              # ROBUST TIMESTAMP NORMALIZATION
              # --------------------------------------------------

              raw_timestamp = df[
                  timestamp_column
              ]

              numeric_timestamp = pd.to_numeric(
                  raw_timestamp,
                  errors="coerce",
              )

              numeric_ratio = (
                  numeric_timestamp.notna().mean()
              )

              print(
                  f"{file}: "
                  f"numeric timestamp ratio="
                  f"{numeric_ratio:.3f}"
              )

              if numeric_ratio >= 0.80:
                  values = (
                      numeric_timestamp
                      .dropna()
                      .abs()
                  )

                  if not values.empty:
                      median_timestamp = float(
                          values.median()
                      )

                      if median_timestamp >= 1e17:
                          timestamp_unit = "ns"

                      elif median_timestamp >= 1e14:
                          timestamp_unit = "us"

                      elif median_timestamp >= 1e11:
                          timestamp_unit = "ms"

                      elif median_timestamp >= 1e9:
                          timestamp_unit = "s"

                      else:
                          timestamp_unit = None

                      print(
                          f"{file}: "
                          f"detected timestamp unit="
                          f"{timestamp_unit}"
                      )

                      if timestamp_unit:
                          df["timestamp"] = (
                              pd.to_datetime(
                                  numeric_timestamp,
                                  unit=timestamp_unit,
                                  utc=True,
                                  errors="coerce",
                              )
                          )
                      else:
                          df["timestamp"] = (
                              pd.to_datetime(
                                  raw_timestamp,
                                  utc=True,
                                  errors="coerce",
                              )
                          )

                  else:
                      df["timestamp"] = (
                          pd.to_datetime(
                              raw_timestamp,
                              utc=True,
                              errors="coerce",
                          )
                      )

              else:
                  df["timestamp"] = (
                      pd.to_datetime(
                          raw_timestamp,
                          utc=True,
                          errors="coerce",
                      )
                  )

              # --------------------------------------------------
              # CONVERT OHLCV
              # --------------------------------------------------

              for column in required:
                  df[column] = pd.to_numeric(
                      df[column],
                      errors="coerce",
                  )

              if "volume" not in df.columns:
                  df["volume"] = 0.0

              df["volume"] = pd.to_numeric(
                  df["volume"],
                  errors="coerce",
              ).fillna(0.0)

              # --------------------------------------------------
              # SELECT CANONICAL COLUMNS
              # --------------------------------------------------

              df = df[
                  [
                      "timestamp",
                      "open",
                      "high",
                      "low",
                      "close",
                      "volume",
                  ]
              ]

              df = df.dropna(
                  subset=[
                      "timestamp",
                      "open",
                      "high",
                      "low",
                      "close",
                  ]
              )

              if not df.empty:
                  frames.append(df)

          if not frames:
              raise SystemExit(
                  "ERROR: No valid M5 OHLC data "
                  "could be normalized."
              )

          combined = pd.concat(
              frames,
              ignore_index=True,
          )

          combined = combined.sort_values(
              "timestamp"
          )

          combined = combined.drop_duplicates(
              subset=["timestamp"],
              keep="last",
          )

          combined = combined.reset_index(
              drop=True
          )

          if combined.empty:
              raise SystemExit(
                  "ERROR: Normalized M5 dataset "
                  "is empty."
              )

          # --------------------------------------------------
          # TIMESTAMP SAFETY CHECKS
          # --------------------------------------------------

          minimum_timestamp = (
              combined["timestamp"].min()
          )

          maximum_timestamp = (
              combined["timestamp"].max()
          )

          print("")
          print(
              "Normalized timestamp range:"
          )

          print(
              f"Minimum: {minimum_timestamp}"
          )

          print(
              f"Maximum: {maximum_timestamp}"
          )

          if minimum_timestamp.year < 2020:
              raise SystemExit(
                  "ERROR: M5 timestamps are invalid: "
                  f"{minimum_timestamp}"
              )

          if maximum_timestamp.year > 2100:
              raise SystemExit(
                  "ERROR: M5 timestamps are invalid: "
                  f"{maximum_timestamp}"
              )

          # --------------------------------------------------
          # MONTH SANITY CHECK
          # --------------------------------------------------

          expected_year = int(
              month[:4]
          )

          expected_month = int(
              month[5:7]
          )

          timestamp_years = (
              combined["timestamp"]
              .dt.year
              .unique()
              .tolist()
          )

          timestamp_months = (
              combined["timestamp"]
              .dt.to_period("M")
              .astype(str)
              .unique()
              .tolist()
          )

          print(
              f"Expected year: {expected_year}"
          )

          print(
              f"Timestamp years: {timestamp_years}"
          )

          print(
              f"Timestamp months: "
              f"{timestamp_months}"
          )

          if expected_year not in timestamp_years:
              raise SystemExit(
                  "ERROR: Normalized M5 data does "
                  "not contain the requested audit year."
              )

          expected_month_string = (
              f"{expected_year:04d}-"
              f"{expected_month:02d}"
          )

          if (
              expected_month_string
              not in timestamp_months
          ):
              raise SystemExit(
                  "ERROR: Normalized M5 data does "
                  "not contain the requested audit month."
              )

          # --------------------------------------------------
          # OHLC SANITY CHECKS
          # --------------------------------------------------

          if (
              combined["high"]
              < combined["low"]
          ).any():
              raise SystemExit(
                  "ERROR: M5 data contains high < low."
              )

          if (
              combined["high"]
              < combined["open"]
          ).any():
              raise SystemExit(
                  "ERROR: M5 data contains high < open."
              )

          if (
              combined["high"]
              < combined["close"]
          ).any():
              raise SystemExit(
                  "ERROR: M5 data contains high < close."
              )

          if (
              combined["low"]
              > combined["open"]
          ).any():
              raise SystemExit(
                  "ERROR: M5 data contains low > open."
              )

          if (
              combined["low"]
              > combined["close"]
          ).any():
              raise SystemExit(
                  "ERROR: M5 data contains low > close."
              )

          # --------------------------------------------------
          # WRITE NORMALIZED DATA
          # --------------------------------------------------

          output.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          combined.to_csv(
              output,
              index=False,
          )

          print("")
          print(
              "=================================================="
          )
          print(
              "NORMALIZED M5 DATASET"
          )
          print(
              "=================================================="
          )

          print(
              f"Rows:   {len(combined)}"
          )

          print(
              f"Start:  "
              f"{combined['timestamp'].min()}"
          )

          print(
              f"End:    "
              f"{combined['timestamp'].max()}"
          )

          print(
              f"Output: {output}"
          )

          print(
              "=================================================="
          )
          PY

      # ============================================================
      # VERIFY TRADE TIMESTAMPS BEFORE FORENSICS
      #
      # This catches the exact class of problem that previously
      # produced trade_count=0.
      # ============================================================

      - name: Validate audit trade timestamps
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "audit_output/monthly_trade_audit.json"

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as f:
              report = json.load(f)

          trades = report.get(
              "trades",
              []
          )

          if not trades:
              raise SystemExit(
                  "ERROR: No trade records available."
              )

          print(
              f"Validating {len(trades)} trade records..."
          )

          invalid = []

          for index, trade in enumerate(
              trades,
              start=1,
          ):
              trade_id = trade.get(
                  "trade_id",
                  f"trade-{index}",
              )

              opened_at = trade.get(
                  "opened_at"
              )

              closed_at = trade.get(
                  "closed_at"
              )

              if not opened_at:
                  invalid.append(
                      (
                          trade_id,
                          "missing opened_at",
                      )
                  )
                  continue

              if not closed_at:
                  invalid.append(
                      (
                          trade_id,
                          "missing closed_at",
                      )
                  )
                  continue

              try:
                  open_dt = datetime.fromisoformat(
                      str(opened_at)
                      .replace(
                          "Z",
                          "+00:00",
                      )
                  )

                  close_dt = datetime.fromisoformat(
                      str(closed_at)
                      .replace(
                          "Z",
                          "+00:00",
                      )
                  )

                  if open_dt.tzinfo is None:
                      open_dt = open_dt.replace(
                          tzinfo=timezone.utc
                      )

                  if close_dt.tzinfo is None:
                      close_dt = close_dt.replace(
                          tzinfo=timezone.utc
                      )

                  open_dt = open_dt.astimezone(
                      timezone.utc
                  )

                  close_dt = close_dt.astimezone(
                      timezone.utc
                  )

                  if close_dt < open_dt:
                      invalid.append(
                          (
                              trade_id,
                              "closed_at before opened_at",
                          )
                      )

              except Exception as exc:
                  invalid.append(
                      (
                          trade_id,
                          f"timestamp parse error: {exc}",
                      )
                  )

          if invalid:
              print("")
              print(
                  "INVALID TRADE TIMESTAMPS:"
              )

              for trade_id, reason in invalid:
                  print(
                      f"- {trade_id}: {reason}"
                  )

              raise SystemExit(
                  "ERROR: One or more audit trade "
                  "timestamps are invalid."
              )

          print(
              "All audit trade timestamps are valid."
          )
          print(
              "Trade timestamps are ready for "
              "price-path reconstruction."
          )
          PY

      # ============================================================
      # RUN PRICE-PATH FORENSICS
      # ============================================================

      - name: Run monthly trade forensic analysis
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          M5_FILE="normalized_m5/xauusd_m5_${AUDIT_MONTH}_normalized.csv"

          test -s "${M5_FILE}"

          echo "=================================================="
          echo "RUNNING PRICE-PATH FORENSICS"
          echo "=================================================="
          echo "Audit month: ${AUDIT_MONTH}"
          echo "M5 file:     ${M5_FILE}"
          echo ""

          python scripts/monthly_trade_forensic.py \
            --audit audit_output/monthly_trade_audit.json \
            --m5 "${M5_FILE}" \
            --output "forensic_output/${AUDIT_MONTH}"

      # ============================================================
      # VALIDATE FORENSIC REPORT
      # ============================================================

      - name: Validate forensic report
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import json
          import os

          month = os.environ["AUDIT_MONTH"]

          audit_path = (
              "audit_output/monthly_trade_audit.json"
          )

          forensic_path = (
              f"forensic_output/{month}/"
              "monthly_trade_forensic.json"
          )

          with open(
              audit_path,
              "r",
              encoding="utf-8",
          ) as f:
              audit = json.load(f)

          with open(
              forensic_path,
              "r",
              encoding="utf-8",
          ) as f:
              report = json.load(f)

          print("==================================================")
          print("FORENSIC REPORT VALIDATION")
          print("==================================================")

          print(
              "Forensic report type:",
              report.get("report_type"),
          )

          print(
              "Version:",
              report.get("version"),
          )

          print(
              "Month:",
              report.get("month"),
          )

          print(
              "Research only:",
              report.get("research_only"),
          )

          print(
              "Live trading changed:",
              report.get("live_trading_changed"),
          )

          print(
              "Strategy modified:",
              report.get("strategy_modified"),
          )

          print(
              "Positions modified:",
              report.get("positions_modified"),
          )

          print(
              "Orders created:",
              report.get("orders_created"),
          )

          print(
              "Candidates promoted:",
              report.get("candidates_promoted"),
          )

          if report.get("report_type") != (
              "RAYMOND_MONTHLY_TRADE_FORENSIC"
          ):
              raise SystemExit(
                  "ERROR: Unexpected forensic report type."
              )

          if report.get("month") != month:
              raise SystemExit(
                  "ERROR: Forensic report month mismatch."
              )

          required_safety = {
              "research_only": True,
              "live_trading_changed": False,
              "strategy_modified": False,
              "positions_modified": False,
              "orders_created": False,
              "candidates_promoted": False,
          }

          for key, expected in required_safety.items():
              if report.get(key) is not expected:
                  raise SystemExit(
                      f"ERROR: Safety check failed: "
                      f"{key}={report.get(key)!r}, "
                      f"expected {expected!r}"
                  )

          audit_trades = audit.get(
              "trades",
              []
          )

          forensic_trades = report.get(
              "trades",
              []
          )

          audit_trade_count = len(
              audit_trades
          )

          forensic_trade_count = len(
              forensic_trades
          )

          print("")
          print(
              f"Audit trade count:    "
              f"{audit_trade_count}"
          )

          print(
              f"Forensic trade count: "
              f"{forensic_trade_count}"
          )

          # The forensic report must account for every audit trade.
          if forensic_trade_count != audit_trade_count:
              raise SystemExit(
                  "ERROR: Forensic trade count does not "
                  "match monthly audit trade count."
              )

          audit_ids = {
              str(
                  trade.get("trade_id")
              )
              for trade in audit_trades
          }

          forensic_ids = {
              str(
                  trade.get("trade_id")
              )
              for trade in forensic_trades
          }

          missing_ids = (
              audit_ids
              - forensic_ids
          )

          unexpected_ids = (
              forensic_ids
              - audit_ids
          )

          if missing_ids:
              print(
                  "Missing forensic trade IDs:"
              )

              for trade_id in sorted(
                  missing_ids
              ):
                  print(
                      f"- {trade_id}"
                  )

              raise SystemExit(
                  "ERROR: Some audit trades were not "
                  "included in forensic output."
              )

          if unexpected_ids:
              print(
                  "Unexpected forensic trade IDs:"
              )

              for trade_id in sorted(
                  unexpected_ids
              ):
                  print(
                      f"- {trade_id}"
                  )

              raise SystemExit(
                  "ERROR: Forensic output contains "
                  "unexpected trade IDs."
              )

          summary = report.get(
              "summary",
              {}
          )

          print("")
          print(
              f"Loss count:           "
              f"{summary.get('loss_count')}"
          )

          print(
              f"Favorable-first:      "
              f"{summary.get('losses_favorable_first')}"
          )

          print(
              f"MFE >= 0.25R:         "
              f"{summary.get('losses_mfe_ge_0_25r')}"
          )

          print(
              f"MFE >= 0.50R:         "
              f"{summary.get('losses_mfe_ge_0_5r')}"
          )

          print(
              f"MFE >= 0.75R:         "
              f"{summary.get('losses_mfe_ge_0_75r')}"
          )

          print(
              f"MFE >= 1.00R:         "
              f"{summary.get('losses_mfe_ge_1r')}"
          )

          print(
              f"MFE >= 1.50R:         "
              f"{summary.get('losses_mfe_ge_1_5r')}"
          )

          print(
              f"MFE >= 2.00R:         "
              f"{summary.get('losses_mfe_ge_2r')}"
          )

          print(
              f"Reached TP then lost: "
              f"{summary.get('losses_reached_tp_then_lost')}"
          )

          print("")
          print(
              "Forensic validation PASSED."
          )

          print(
              "Every monthly audit trade is represented "
              "in the forensic report."
          )

          print("==================================================")
          PY

