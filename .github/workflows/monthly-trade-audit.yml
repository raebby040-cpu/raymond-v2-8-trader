name: Monthly Trade Audit

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to audit (YYYY-MM)"
        required: true
        default: "2026-09"

permissions:
  contents: read

jobs:
  monthly-trade-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Run September 2026 audit through Render
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          set -e

          BASE_URL="https://raymond-v2-8-trader.onrender.com"
          AUDIT_URL="${BASE_URL}/api/research/monthly-audit?month=${AUDIT_MONTH}"

          echo "Requesting monthly audit for ${AUDIT_MONTH}..."
          echo "Endpoint: ${BASE_URL}/api/research/monthly-audit"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            "${AUDIT_URL}" \
            -o monthly_trade_audit.json

          echo "Audit response received."

      - name: Validate audit response
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          set -e

          python - <<'PY'
          import json
          import os
          import sys

          month = os.environ["AUDIT_MONTH"]

          with open("monthly_trade_audit.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          print("Report type:", report.get("report_type"))
          print("Report version:", report.get("version"))
          print("Audit month:", report.get("month"))
          print("Research only:", report.get("research_only"))
          print("Live trading changed:", report.get("live_trading_changed"))

          if report.get("report_type") != "RAYMOND_MONTHLY_TRADE_AUDIT":
              print("ERROR: Unexpected report type.")
              sys.exit(1)

          if report.get("month") != month:
              print(
                  f"ERROR: Requested month {month}, "
                  f"but report contains {report.get('month')}."
              )
              sys.exit(1)

          if report.get("research_only") is not True:
              print("ERROR: Audit is not marked research_only=true.")
              sys.exit(1)

          if report.get("live_trading_changed") is not False:
              print("ERROR: Audit reports that live trading changed.")
              sys.exit(1)

          performance = report.get("performance", {})
          accounting = report.get("accounting", {})

          print("Total trades:", performance.get("total_trades"))
          print("Total PnL:", performance.get("total_pnl"))
          print("Win rate:", performance.get("win_rate_pct"))
          print("Profit factor:", performance.get("profit_factor"))
          print("Max-profit / max-drawdown excursion analysis present:", 
                "excursion_analysis" in report)

          if accounting.get("accounting_reconciled") is not True:
              print("ERROR: Accounting is not reconciled.")
              sys.exit(1)

          print("Audit validation: PASSED")
          PY

      - name: Save audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-trade-audit-${{ inputs.month }}
          path: monthly_trade_audit.json
          if-no-files-found: error

      - name: Print audit summary
        run: |
          python - <<'PY'
          import json

          with open("monthly_trade_audit.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          performance = report.get("performance", {})
          accounting = report.get("accounting", {})
          excursion = report.get("excursion_analysis", {})

          print("")
          print("========================================")
          print("RAYMOND MONTHLY TRADE AUDIT")
          print("========================================")
          print("Month:", report.get("month"))
          print("Research only:", report.get("research_only"))
          print("Live trading changed:", report.get("live_trading_changed"))
          print("----------------------------------------")
          print("Total trades:", performance.get("total_trades"))
          print("Winning trades:", performance.get("winning_trades"))
          print("Losing trades:", performance.get("losing_trades"))
          print("Win rate:", performance.get("win_rate_pct"))
          print("Total PnL:", performance.get("total_pnl"))
          print("Profit factor:", performance.get("profit_factor"))
          print("----------------------------------------")
          print("Accounting reconciled:",
                accounting.get("accounting_reconciled"))
          print("Max-profit / drawdown analysis:")
          print(
              excursion.get(
                  "losing_trades_that_were_profitable_first",
                  {}
              )
          )
          print("----------------------------------------")
          print("No strategy parameters were changed by this workflow.")
          print("========================================")
          PY
