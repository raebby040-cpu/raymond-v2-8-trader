name: Safely Connect User Paper Positions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-user-paper-positions
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Create module and connect routes safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("backend/app/main.py")
          module_path = Path("backend/app/user_positions_api.py")

          if not main_path.is_file():
              raise SystemExit("STOP: backend/app/main.py was not found.")

          if module_path.exists():
              raise SystemExit(
                  "STOP: user_positions_api.py already exists. "
                  "No files were changed."
              )

          source = main_path.read_text(encoding="utf-8")

          old_import = (
              "try:\n"
              "    from .user_auth import router as user_auth_router\n"
              "except ImportError:\n"
              "    from user_auth import router as user_auth_router"
          )

          new_import = (
              "try:\n"
              "    from .user_auth import router as user_auth_router\n"
              "    from .user_positions_api import router as user_positions_router\n"
              "except ImportError:\n"
              "    from user_auth import router as user_auth_router\n"
              "    from user_positions_api import router as user_positions_router"
          )

          old_registration = (
              "app.include_router(\n"
              "    user_auth_router,\n"
              '    tags=["User Authentication"],\n'
              ")"
          )

          new_registration = (
              old_registration
              + "\n\n"
              + "app.include_router(user_positions_router)"
          )

          if "user_positions_router" in source:
              raise SystemExit(
                  "STOP: a user_positions_router reference already exists. "
                  "No files were changed."
              )

          if source.count(old_import) != 1:
              raise SystemExit(
                  "STOP: expected authentication import block was not found "
                  "exactly once. No files were changed."
              )

          if source.count(old_registration) != 1:
              raise SystemExit(
                  "STOP: expected authentication router registration was not "
                  "found exactly once. No files were changed."
              )

          module = '''"""Authenticated, read-only user paper-position API."""

          from fastapi import APIRouter, Depends, HTTPException, Query
          from sqlalchemy.orm import Session

          try:
              from .database import get_db
              from .models import Position
              from .position_ownership_integration import (
                  get_user_position,
                  get_user_positions,
              )
              from .user_auth import User, get_current_user
          except ImportError:
              from database import get_db
              from models import Position
              from position_ownership_integration import (
                  get_user_position,
                  get_user_positions,
              )
              from user_auth import User, get_current_user

          router = APIRouter(
              prefix="/api/user-paper-positions",
              tags=["User Paper Positions"],
          )


          def serialize_position(position: Position) -> dict:
              direction = position.direction
              status = position.status

              return {
                  "position_id": position.position_id,
                  "trade_id": position.trade_id,
                  "symbol": position.symbol,
                  "direction": direction.value if hasattr(direction, "value") else direction,
                  "status": status.value if hasattr(status, "value") else status,
                  "entry_price": position.entry_price,
                  "current_price": position.current_price,
                  "stop_loss": position.current_stop_loss or position.stop_loss,
                  "take_profit": position.take_profit,
                  "quantity": position.quantity,
                  "remaining_quantity": position.remaining_quantity,
                  "pnl": position.pnl,
                  "partial_close_quantity": position.partial_close_quantity,
                  "partial_close_price": position.partial_close_price,
                  "partial_close_pnl": position.partial_close_pnl,
                  "opened_at": position.opened_at.isoformat() if position.opened_at else None,
                  "closed_at": position.closed_at.isoformat() if position.closed_at else None,
                  "paper_only": True,
                  "live_trading_enabled": False,
                  "broker_orders_allowed": False,
              }


          @router.get("")
          def list_my_paper_positions(
              limit: int = Query(100, ge=1, le=500),
              offset: int = Query(0, ge=0),
              db: Session = Depends(get_db),
              current_user: User = Depends(get_current_user),
          ):
              positions = get_user_positions(
                  db=db,
                  owner_user_id=current_user.user_id,
                  limit=limit,
                  offset=offset,
              )
              return {
                  "count": len(positions),
                  "positions": [
                      serialize_position(position) for position in positions
                  ],
                  "paper_only": True,
                  "live_trading_enabled": False,
                  "broker_orders_allowed": False,
              }


          @router.get("/{position_id}")
          def get_my_paper_position(
              position_id: str,
              db: Session = Depends(get_db),
              current_user: User = Depends(get_current_user),
          ):
              position = get_user_position(
                  db=db,
                  position_id=position_id,
                  owner_user_id=current_user.user_id,
              )
              if position is None:
                  raise HTTPException(
                      status_code=404,
                      detail="Position not found.",
                  )
              return serialize_position(position)
          '''

          # The module text above is indented for safe embedding in this script.
          import textwrap
          module = textwrap.dedent(module).lstrip()

          # Prepare and validate all changes before writing either file.
          updated = source.replace(old_import, new_import, 1)
          updated = updated.replace(old_registration, new_registration, 1)

          if updated == source:
              raise SystemExit("STOP: no changes were produced.")

          if updated.count("app.include_router(user_positions_router)") != 1:
              raise SystemExit("STOP: router registration validation failed.")

          module_path.parent.mkdir(parents=True, exist_ok=True)
          module_path.write_text(module, encoding="utf-8")
          main_path.write_text(updated, encoding="utf-8")

          print("Created backend/app/user_positions_api.py")
          print("Connected the authenticated positions router in main.py")
          print("Strategy and live-trading settings were not intentionally changed.")
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            backend/app/main.py \
            backend/app/user_positions_api.py

      - name: Commit the verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/app/user_positions_api.py
          git commit -m "Safely connect authenticated user paper positions"
          git push origin HEAD:main
