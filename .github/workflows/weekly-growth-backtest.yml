name: Raymond Weekly Growth Strategy Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-growth:
    name: Weekly Growth V1 - XAUUSD H1
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Raymond v2.8
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download XAUUSD H1 historical data
        run: |
          set -euo pipefail

          rm -rf data/historical
          mkdir -p data/historical

          for YEAR in 2024 2025 2026; do

            if [ "$YEAR" = "2024" ]; then
              FROM="2024-01-01"
              TO="2025-01-01"

            elif [ "$YEAR" = "2025" ]; then
              FROM="2025-01-01"
              TO="2026-01-01"

            else
              FROM="2026-01-01"
              TO="2026-10-01"
            fi

            OUT="data/historical/$YEAR"

            mkdir -p "$OUT"

            echo "========================================"
            echo "Downloading XAUUSD H1"
            echo "From: $FROM"
            echo "To:   $TO"
            echo "========================================"

            npx --yes dukascopy-node \
              -i xauusd \
              -from "$FROM" \
              -to "$TO" \
              -t h1 \
              -f csv \
              -dir "$OUT" \
              -bs 5 \
              -bp 1000

            echo "Files produced for $YEAR:"

            find "$OUT" \
              -type f \
              -maxdepth 2 \
              -print

            CSV_COUNT="$(
              find "$OUT" \
                -type f \
                -name '*.csv' \
                -size +1k \
                | wc -l
            )"

            if [ "$CSV_COUNT" -lt 1 ]; then
              echo "ERROR:"
              echo "XAUUSD H1 download produced no non-empty CSV for $YEAR."
              exit 1
            fi

          done

          echo "========================================"
          echo "ALL YEARLY DOWNLOADS COMPLETED"
          echo "========================================"

          find data/historical \
            -type f \
            -name '*.csv' \
            -print

      - name: Locate and normalize XAUUSD dataset
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching downloaded XAUUSD CSV files..."

          find data/historical \
            -type f \
            -name '*.csv' \
            -print

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("data/historical")

          target = (
              root
              / "xauusd_h1_2024_2026_normalized.csv"
          )

          files = sorted(
              p
              for p in root.rglob("*.csv")
              if p != target
              and p.stat().st_size > 1000
          )

          if not files:
              raise SystemExit(
                  "ERROR: No non-empty XAUUSD CSV files were found."
              )

          print()
          print("CSV FILES SELECTED")
          print("----------------------------------------")

          for path in files:
              print(path)

          print("----------------------------------------")

          frames = []

          for source in files:

              print()
              print("Reading:", source)

              df = pd.read_csv(source)

              rename = {}

              for column in df.columns:

                  name = str(column).strip().lower()

                  if name in {
                      "date",
                      "datetime",
                      "time",
                      "timestamp",
                  }:
                      rename[column] = "timestamp"

                  elif name in {
                      "open",
                      "o",
                  }:
                      rename[column] = "open"

                  elif name in {
                      "high",
                      "h",
                  }:
                      rename[column] = "high"

                  elif name in {
                      "low",
                      "l",
                  }:
                      rename[column] = "low"

                  elif name in {
                      "close",
                      "c",
                  }:
                      rename[column] = "close"

                  elif name in {
                      "volume",
                      "vol",
                      "tick_volume",
                  }:
                      rename[column] = "volume"

              df = df.rename(
                  columns=rename
              )

              required = {
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
              }

              missing = (
                  required
                  - set(df.columns)
              )

              if missing:
                  raise SystemExit(
                      f"{source}: missing required columns: "
                      f"{sorted(missing)}"
                  )

              raw_timestamp = df[
                  "timestamp"
              ]

              # Dukascopy CSV timestamps are Unix
              # timestamps in milliseconds.
              if pd.api.types.is_numeric_dtype(
                  raw_timestamp
              ):

                  df["timestamp"] = pd.to_datetime(
                      pd.to_numeric(
                          raw_timestamp,
                          errors="coerce",
                      ),
                      unit="ms",
                      utc=True,
                      errors="coerce",
                  )

              else:

                  df["timestamp"] = pd.to_datetime(
                      raw_timestamp,
                      utc=True,
                      errors="coerce",
                  )

              for column in [
                  "open",
                  "high",
                  "low",
                  "close",
              ]:

                  df[column] = pd.to_numeric(
                      df[column],
                      errors="coerce",
                  )

              df = df.dropna(
                  subset=[
                      "timestamp",
                      "open",
                      "high",
                      "low",
                      "close",
                  ]
              )

              frames.append(df)

          if not frames:
              raise SystemExit(
                  "ERROR: No valid dataframes were created."
              )

          df = pd.concat(
              frames,
              ignore_index=True,
          )

          df = df.sort_values(
              "timestamp"
          )

          df = df.drop_duplicates(
              subset=["timestamp"],
              keep="first",
          )

          invalid = (
              (df["open"] <= 0)
              |
              (df["high"] <= 0)
              |
              (df["low"] <= 0)
              |
              (df["close"] <= 0)
              |
              (df["high"] < df["low"])
              |
              (df["open"] < df["low"])
              |
              (df["open"] > df["high"])
              |
              (df["close"] < df["low"])
              |
              (df["close"] > df["high"])
          )

          if invalid.any():

              raise SystemExit(
                  "Invalid OHLC rows detected: "
                  + str(int(invalid.sum()))
              )

          start = pd.Timestamp(
              "2024-01-01",
              tz="UTC",
          )

          end = pd.Timestamp(
              "2026-10-01",
              tz="UTC",
          )

          df = df[
              (df["timestamp"] >= start)
              &
              (df["timestamp"] < end)
          ].copy()

          if len(df) < 5000:

              raise SystemExit(
                  "Dataset unexpectedly small after normalization: "
                  + str(len(df))
              )

          # Explicit timestamp sanity check.
          # This catches accidentally interpreting
          # millisecond timestamps as nanoseconds.
          if df["timestamp"].min() >= pd.Timestamp(
              "2025-01-01",
              tz="UTC",
          ):

              raise SystemExit(
                  "Timestamp conversion looks incorrect. "
                  "Expected data beginning in 2024."
              )

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          columns = [
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          ]

          if "volume" in df.columns:
              columns.append("volume")

          df[columns].to_csv(
              target,
              index=False,
          )

          print()
          print("========================================")
          print("NORMALIZED XAUUSD DATA")
          print("========================================")
          print(
              "Rows:",
              len(df),
          )
          print(
              "First:",
              df["timestamp"].iloc[0],
          )
          print(
              "Last:",
              df["timestamp"].iloc[-1],
          )
          print(
              "Output:",
              target,
          )
          print("========================================")
          PY

      - name: Validate normalized XAUUSD data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/historical/"
              "xauusd_h1_2024_2026_normalized.csv"
          )

          if not path.exists():
              raise SystemExit(
                  "Normalized dataset does not exist."
              )

          df = pd.read_csv(path)

          required = [
              "timestamp",
              "open",
              "high",
              "low",
              "close",
          ]

          missing = [
              column
              for column in required
              if column not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "Missing columns: "
                  + str(missing)
              )

          if len(df) < 5000:
              raise SystemExit(
                  f"Only {len(df)} rows found."
              )

          parsed = pd.to_datetime(
              df["timestamp"],
              utc=True,
              errors="coerce",
          )

          if parsed.isna().any():
              raise SystemExit(
                  "Normalized file contains invalid timestamps."
              )

          if parsed.min() >= pd.Timestamp(
              "2025-01-01",
              tz="UTC",
          ):

              raise SystemExit(
                  "Normalized timestamps do not begin "
                  "in the expected 2024 period."
              )

          print(
              f"Validated {len(df):,} "
              "XAUUSD H1 candles."
          )

          print(
              "First:",
              parsed.min(),
          )

          print(
              "Last:",
              parsed.max(),
          )
          PY

      - name: Run Weekly Growth V1 backtest
        env:
          PYTHONUNBUFFERED: "1"

        run: |
          set -euo pipefail

          rm -rf weekly_growth_results

          python scripts/run_weekly_growth_backtest.py \
            --input \
              data/historical/xauusd_h1_2024_2026_normalized.csv \
            --output-dir \
              weekly_growth_results \
            --starting-balance \
              1000 \
            --risk-per-trade \
              0.03 \
            --weekly-target \
              0.25 \
            --weekly-loss-limit \
              -0.09 \
            --max-trades-per-week \
              6 \
            --risk-reward \
              2.5 \
            --min-signal-score \
              75 \
            --spread \
              0.30 \
            --slippage \
              0.05

      - name: Display final result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "weekly_growth_results/result.json"
          )

          if not path.exists():
              raise SystemExit(
                  "result.json was not created."
              )

          result = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          metrics = result.get(
              "metrics",
              {}
          )

          print()
          print("========================================")
          print("RAYMOND v2.8")
          print("WEEKLY GROWTH STRATEGY V1")
          print("========================================")
          print()

          print(
              "Starting balance: $"
              + f"{metrics.get('starting_balance', 0):,.2f}"
          )

          print(
              "Ending balance: $"
              + f"{metrics.get('ending_balance', 0):,.2f}"
          )

          print(
              "Total profit: $"
              + f"{metrics.get('total_profit', 0):,.2f}"
          )

          print(
              "Total return: "
              + f"{metrics.get('total_return_pct', 0):.2f}%"
          )

          print(
              "Trades: "
              + str(
                  metrics.get(
                      "total_trades",
                      0,
                  )
              )
          )

          print(
              "Wins: "
              + str(
                  metrics.get(
                      "wins",
                      0,
                  )
              )
          )

          print(
              "Losses: "
              + str(
                  metrics.get(
                      "losses",
                      0,
                  )
              )
          )

          print(
              "Win rate: "
              + f"{metrics.get('win_rate_pct', 0):.2f}%"
          )

          print(
              "Profit factor: "
              + str(
                  metrics.get(
                      "profit_factor"
                  )
              )
          )

          print(
              "Average R: "
              + f"{metrics.get('average_r', 0):.3f}"
          )

          print(
              "Maximum drawdown: "
              + f"{metrics.get('max_drawdown_pct', 0):.2f}%"
          )

          print()

          print(
              "Weeks tested: "
              + str(
                  metrics.get(
                      "total_weeks",
                      0,
                  )
              )
          )

          print(
              "Positive weeks: "
              + str(
                  metrics.get(
                      "positive_weeks",
                      0,
                  )
              )
          )

          print(
              "Negative weeks: "
              + str(
                  metrics.get(
                      "negative_weeks",
                      0,
                  )
              )
          )

          print(
              "Weeks >= 25%: "
              + str(
                  metrics.get(
                      "weekly_target_hits",
                      0,
                  )
              )
          )

          print(
              "25% target hit rate: "
              + f"{metrics.get('weekly_target_hit_rate_pct', 0):.2f}%"
          )

          print(
              "Average weekly return: "
              + f"{metrics.get('average_weekly_return_pct', 0):.2f}%"
          )

          print(
              "Median weekly return: "
              + f"{metrics.get('median_weekly_return_pct', 0):.2f}%"
          )

          print()

          print(
              "Best week: "
              + str(
                  metrics.get(
                      "best_week"
                  )
              )
              + " / "
              + str(
                  metrics.get(
                      "best_week_return_pct"
                  )
              )
              + "%"
          )

          print(
              "Worst week: "
              + str(
                  metrics.get(
                      "worst_week"
                  )
              )
              + " / "
              + str(
                  metrics.get(
                      "worst_week_return_pct"
                  )
              )
              + "%"
          )

          print()

          print("========================================")
          PY

      - name: Upload Weekly Growth results
        uses: actions/upload-artifact@v4

        with:
          name: raymond-weekly-growth-v1-results

          path: |
            weekly_growth_results/
            data/historical/xauusd_h1_2024_2026_normalized.csv

          retention-days: 30

      - name: Upload normalized dataset
        uses: actions/upload-artifact@v4

        with:
          name: raymond-xauusd-h1-normalized-2024-2026

          path: data/historical/xauusd_h1_2024_2026_normalized.csv

          retention-days: 7
