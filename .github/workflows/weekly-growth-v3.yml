name: Raymond Weekly Growth V3 Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-growth-v3:
    name: Weekly Growth V3 - Robustness Research
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout Raymond v2.8
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download XAUUSD H1 data
        shell: bash
        run: |
          set -euo pipefail

          rm -rf data/historical
          mkdir -p data/historical

          for YEAR in 2024 2025 2026
          do
            if [ "$YEAR" = "2024" ]; then
              FROM="2024-01-01"
              TO="2025-01-01"
            elif [ "$YEAR" = "2025" ]; then
              FROM="2025-01-01"
              TO="2026-01-01"
            else
              FROM="2026-01-01"
              TO="2026-10-01"
            fi

            OUT="data/historical/$YEAR"
            mkdir -p "$OUT"

            echo "Downloading XAUUSD H1: $FROM -> $TO"

            npx --yes dukascopy-node \
              -i xauusd \
              -from "$FROM" \
              -to "$TO" \
              -t h1 \
              -f csv \
              -dir "$OUT" \
              -bs 5 \
              -bp 1000

            CSV_COUNT="$(
              find "$OUT" \
                -type f \
                -name '*.csv' \
                -size +1k \
                | wc -l
            )"

            if [ "$CSV_COUNT" -lt 1 ]; then
              echo "ERROR: no usable CSV produced for $YEAR"
              exit 1
            fi
          done

      - name: Normalize XAUUSD dataset
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("data/historical")
          target = root / "xauusd_h1_2024_2026_normalized.csv"

          files = sorted(
              p for p in root.rglob("*.csv")
              if p != target and p.stat().st_size > 1000
          )

          if not files:
              raise SystemExit("No XAUUSD CSV files found.")

          frames = []

          for source in files:
              df = pd.read_csv(source)

              rename = {}

              for column in df.columns:
                  name = str(column).strip().lower()

                  if name in {"date", "datetime", "time", "timestamp"}:
                      rename[column] = "timestamp"
                  elif name in {"open", "o"}:
                      rename[column] = "open"
                  elif name in {"high", "h"}:
                      rename[column] = "high"
                  elif name in {"low", "l"}:
                      rename[column] = "low"
                  elif name in {"close", "c"}:
                      rename[column] = "close"
                  elif name in {"volume", "vol", "tick_volume"}:
                      rename[column] = "volume"

              df = df.rename(columns=rename)

              required = {
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
              }

              missing = required - set(df.columns)

              if missing:
                  raise SystemExit(
                      f"{source}: missing columns: {sorted(missing)}"
                  )

              raw_timestamp = df["timestamp"]

              if pd.api.types.is_numeric_dtype(raw_timestamp):
                  df["timestamp"] = pd.to_datetime(
                      pd.to_numeric(
                          raw_timestamp,
                          errors="coerce",
                      ),
                      unit="ms",
                      utc=True,
                      errors="coerce",
                  )
              else:
                  df["timestamp"] = pd.to_datetime(
                      raw_timestamp,
                      utc=True,
                      errors="coerce",
                  )

              for column in ["open", "high", "low", "close"]:
                  df[column] = pd.to_numeric(
                      df[column],
                      errors="coerce",
                  )

              if "volume" not in df.columns:
                  df["volume"] = 0.0
              else:
                  df["volume"] = pd.to_numeric(
                      df["volume"],
                      errors="coerce",
                  )

              df = df.dropna(
                  subset=[
                      "timestamp",
                      "open",
                      "high",
                      "low",
                      "close",
                  ]
              )

              frames.append(
                  df[
                      [
                          "timestamp",
                          "open",
                          "high",
                          "low",
                          "close",
                          "volume",
                      ]
                  ]
              )

          out = pd.concat(
              frames,
              ignore_index=True,
          )

          out = (
              out
              .sort_values("timestamp")
              .drop_duplicates("timestamp", keep="last")
          )

          invalid = (
              (out["open"] <= 0)
              | (out["high"] <= 0)
              | (out["low"] <= 0)
              | (out["close"] <= 0)
              | (out["high"] < out["low"])
              | (out["open"] < out["low"])
              | (out["open"] > out["high"])
              | (out["close"] < out["low"])
              | (out["close"] > out["high"])
          )

          if invalid.any():
              raise SystemExit(
                  f"Invalid OHLC rows: {int(invalid.sum())}"
              )

          start = pd.Timestamp("2024-01-01", tz="UTC")
          end = pd.Timestamp("2026-10-01", tz="UTC")

          out = out[
              (out["timestamp"] >= start)
              & (out["timestamp"] < end)
          ].copy()

          if len(out) < 5000:
              raise SystemExit(
                  f"Only {len(out)} candles found."
              )

          if out["timestamp"].min() >= pd.Timestamp(
              "2025-01-01",
              tz="UTC",
          ):
              raise SystemExit(
                  "Timestamp conversion is incorrect; "
                  "expected data beginning in 2024."
              )

          if out["timestamp"].max() < pd.Timestamp(
              "2026-01-01",
              tz="UTC",
          ):
              raise SystemExit(
                  "Expected 2026 data was not found."
              )

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          out.to_csv(
              target,
              index=False,
          )

          print(
              f"Validated {len(out):,} XAUUSD H1 candles."
          )
          print("First:", out["timestamp"].min())
          print("Last:", out["timestamp"].max())
          PY

      - name: Validate normalized data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/historical/"
              "xauusd_h1_2024_2026_normalized.csv"
          )

          df = pd.read_csv(path)

          if len(df) < 5000:
              raise SystemExit(
                  f"Only {len(df)} rows found."
              )

          ts = pd.to_datetime(
              df["timestamp"],
              utc=True,
              errors="coerce",
          )

          if ts.isna().any():
              raise SystemExit(
                  "Invalid timestamps found."
              )

          print(
              f"Validated {len(df):,} candles."
          )
          print("First:", ts.min())
          print("Last:", ts.max())
          PY

      - name: Run V3 robustness research
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          rm -rf backtest_results/weekly_growth_v3

          python \
            scripts/run_weekly_growth_v3_research.py \
            data/historical/xauusd_h1_2024_2026_normalized.csv \
            backtest_results/weekly_growth_v3

      - name: Print V3 result
        if: always()
        run: |
          if [ \
            -f \
            backtest_results/weekly_growth_v3/summary.txt
          ]; then
            cat \
              backtest_results/weekly_growth_v3/summary.txt
          else
            echo "No V3 summary was produced."
          fi

      - name: Upload V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raymond-weekly-growth-v3-results
          path: |
            backtest_results/weekly_growth_v3/
            data/historical/xauusd_h1_2024_2026_normalized.csv
          if-no-files-found: warn
          retention-days: 14
